<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte suivi OP — Cadastre / Foncier repéré</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
  #map { height: 100%; width: 100%; }
  .maplibregl-popup-content { font-size: 13px; line-height: 1.6; min-width: 180px; padding: 10px 12px; background: rgba(255, 255, 255, 0.88); }
  .maplibregl-popup-content b { color: #1a5fb4; font-size: 14px; }
  .popup-commune { color: #666; font-size: 12px; }
  .controle-cadastre {
    background: white;
    padding: 6px 10px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 10px;
  }
  .controle-cadastre label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    white-space: nowrap;
  }
  .controle-cadastre .groupe-titre {
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    color: #666;
    margin-top: 4px;
  }
  .controle-cadastre .legende-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #444;
  }
  .legende-swatch { width: 13px; height: 13px; border: 1px solid rgba(0,0,0,0.3); flex: none; }
</style>
</head>
<body>
<div id="map"></div>

<script>
// ============================================================
// NOMS DES COLONNES — table OP (adapte si besoin)
// ============================================================
const COL_LAT     = "latitude";
const COL_LON     = "longitude";
const COL_TITRE   = "Libelle";              // libellé opération
const COL_ADRESSE = "Adresse_normalisee";
const COL_COMMUNE = "Commune";
const COL_STATUT  = "Statut";               // statut de l'opération (optionnel dans le popup)

const CENTRE_DEFAUT = [-1.10, 43.38]; // MapLibre attend [lon, lat]
const ZOOM_DEFAUT   = 10;

// --- Suivi de visite (compteur privé, visible uniquement par le propriétaire du document
// dans la table Visites — voir plus bas la fonction enregistrerVisite) ---
const TABLE_PARTICIPANTS  = "Participants";
const TABLE_VISITES       = "Visites";
const COL_PART_EMAIL      = "Email";
const COL_PART_NOM        = "Nom";
const COL_PART_ORGANISME  = "Organisme";
const COL_VISITE_EMAIL      = "Email";
const COL_VISITE_NOM        = "Nom";
const COL_VISITE_ORGANISME  = "Organisme";
const COL_VISITE_DATE       = "Date_Visite";

// --- Fond de carte vectoriel IGN Géoplateforme, gratuit et sans clé ---
const STYLE_FOND_EPURE   = "https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/epure.json";
const STYLE_FOND_SECOURS = "https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/gris.json";

// --- Fichier GeoJSON du foncier repéré (à héberger à côté de ce HTML) ---
// properties attendues par polygone : durete ("forte"|"faible"), enjeu ("fort"|"faible"),
// nom, commune, surface (optionnels, pour le popup)
const FICHIER_FONCIER = "foncier_repere.geojson";

const COULEUR_DURETE = { forte: "#E53935", faible: "#7CB342" }; // rouge / vert
const COULEUR_DURETE_DEFAUT = "#888888";
// ============================================================

let map;
let popupOuvert = null;
let rowIdSelectionne = null;
let derniersRecords = [];
let cartePromise = null;

// --- Couleur unique pour tous les marqueurs OP (plus de distinction par commune) ---
const COULEUR_OP = { normal: "#1a5fb4", intense: "#0d3b73" };

// ============================================================
// Calques "paresseux" : le fichier (GeoJSON, etc.) n'est téléchargé qu'au premier clic
// sur la case correspondante, jamais au chargement de la carte — et jamais re-téléchargé
// ensuite (mis en cache en mémoire pour la durée de la session).
// ============================================================
const calquesParesseux = {};

function declarerCalqueParesseux(nom, fonctionChargement) {
  calquesParesseux[nom] = { charge: false, enCours: null, fonctionChargement };
}

async function activerCalqueParesseux(nom) {
  const entree = calquesParesseux[nom];
  if (!entree || entree.charge) return;
  if (!entree.enCours) {
    entree.enCours = entree.fonctionChargement();
  }
  try {
    await entree.enCours;
    entree.charge = true;
  } catch (err) {
    console.error(`Erreur chargement du calque paresseux '${nom}' :`, err);
    entree.enCours = null;
  }
}

async function resoudreStyleFond() {
  try {
    const r = await fetch(STYLE_FOND_EPURE, { method: "GET" });
    if (r.ok) return STYLE_FOND_EPURE;
  } catch (e) { /* réseau/CORS indisponible → bascule silencieuse */ }
  console.warn("Widget carte : style IGN 'épuré' indisponible, bascule sur 'gris'.");
  return STYLE_FOND_SECOURS;
}

// ============================================================
// Génération des motifs de hachures (canvas → image MapLibre via addImage).
// Deux motifs : enjeu fort (hachures serrées, foncées) / enjeu faible (hachures
// espacées, claires). Utilisés en fill-pattern, superposés à la couleur de dureté.
// ============================================================
function creerImageHachure(espacement, epaisseur, opacite) {
  const taille = 10;
  const canvas = document.createElement("canvas");
  canvas.width = taille; canvas.height = taille;
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = `rgba(0,0,0,${opacite})`;
  ctx.lineWidth = epaisseur;
  ctx.beginPath();
  ctx.moveTo(0, taille); ctx.lineTo(taille, 0);
  ctx.moveTo(-espacement, taille - espacement); ctx.lineTo(espacement, -espacement + taille);
  ctx.stroke();
  return ctx.getImageData(0, 0, taille, taille);
}

function enregistrerImagesHachures() {
  if (!map.hasImage("hachure-fort"))   map.addImage("hachure-fort",   creerImageHachure(3, 1.6, 0.55));
  if (!map.hasImage("hachure-faible")) map.addImage("hachure-faible", creerImageHachure(5, 1.2, 0.25));
}

async function initCarte() {
  const styleFond = await resoudreStyleFond();

  map = new maplibregl.Map({
    container: "map",
    style: styleFond,
    center: CENTRE_DEFAUT,
    zoom: ZOOM_DEFAUT,
    attributionControl: false
  });
  map.addControl(new maplibregl.AttributionControl({
    customAttribution: "Fond de plan © IGN — Cadastre © DGFiP"
  }));

  await new Promise(resolve => map.on("load", resolve));

  // --- Cadastre DGFiP (raster WMTS) — ajouté caché, affiché seulement via la case ---
  map.addSource("cadastre", {
    type: "raster",
    tiles: [
      "https://data.geopf.fr/wmts?layer=CADASTRALPARCELS.PARCELLAIRE_EXPRESS&style=PCI%20vecteur&tilematrixset=PM_0_19&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}"
    ],
    tileSize: 256,
    minzoom: 0,
    maxzoom: 22
  });
  map.addLayer({
    id: "cadastre",
    type: "raster",
    source: "cadastre",
    paint: { "raster-opacity": 0.75 },
    layout: { visibility: "none" }
  });

  // --- Foncier repéré (GeoJSON, paresseux) : remplissage par dureté + hachures par enjeu ---
  declarerCalqueParesseux("foncier", async () => {
    const res = await fetch(FICHIER_FONCIER);
    const geojson = await res.json();

    enregistrerImagesHachures();
    map.addSource("foncier", { type: "geojson", data: geojson });

    map.addLayer({
      id: "foncier-remplissage",
      type: "fill",
      source: "foncier",
      paint: {
        "fill-color": ["match", ["downcase", ["to-string", ["get", "durete"]]],
          "forte",  COULEUR_DURETE.forte,
          "faible", COULEUR_DURETE.faible,
          COULEUR_DURETE_DEFAUT
        ],
        "fill-opacity": 0.45
      },
      layout: { visibility: "none" }
    });
    map.addLayer({
      id: "foncier-hachure",
      type: "fill",
      source: "foncier",
      paint: {
        "fill-pattern": ["match", ["downcase", ["to-string", ["get", "enjeu"]]],
          "fort",   "hachure-fort",
          "faible", "hachure-faible",
          "hachure-faible"
        ],
        "fill-opacity": 0.9
      },
      layout: { visibility: "none" }
    });
    map.addLayer({
      id: "foncier-contour",
      type: "line",
      source: "foncier",
      paint: {
        "line-color": ["match", ["downcase", ["to-string", ["get", "durete"]]],
          "forte",  COULEUR_DURETE.forte,
          "faible", COULEUR_DURETE.faible,
          COULEUR_DURETE_DEFAUT
        ],
        "line-width": 2
      },
      layout: { visibility: "none" }
    });

    map.on("click", "foncier-remplissage", e => {
      const p = e.features[0].properties;
      const nom = p.nom || "Secteur foncier";
      const commune = p.commune || "";
      const surface = p.surface ? `${p.surface} m²` : "";
      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`<b>${nom}</b><br>${commune}<br>Dureté : ${p.durete || "—"} · Enjeu : ${p.enjeu || "—"}${surface ? "<br>Surface : "+surface : ""}`)
        .addTo(map);
    });
    map.on("mouseenter", "foncier-remplissage", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "foncier-remplissage", () => { map.getCanvas().style.cursor = ""; });
  });

  // --- Marqueurs OP (source GeoJSON reconstruite à chaque mise à jour Grist) ---
  map.addSource("op", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "op-cercles",
    type: "circle",
    source: "op",
    paint: {
      "circle-radius":        ["case", ["get", "selectionne"], 9, 6],
      "circle-color":         ["case", ["get", "selectionne"], ["get", "couleurIntense"], ["get", "couleurNormal"]],
      "circle-opacity":       ["case", ["get", "selectionne"], 0.85, 0.55],
      "circle-stroke-color":  ["case", ["get", "selectionne"], ["get", "couleurIntense"], ["get", "couleurNormal"]],
      "circle-stroke-width":  ["case", ["get", "selectionne"], 2, 1.5],
      "circle-stroke-opacity":["case", ["get", "selectionne"], 1, 0.75]
    }
  });

  map.on("click", "op-cercles", e => {
    const f = e.features[0];
    const rowId = f.properties.rowId;
    appliquerSelectionVisuelle(rowId);
    ouvrirPopup(rowId, f.geometry.coordinates, f.properties.popupHtml);
    grist.setCursorPos({ rowId });
  });
  map.on("mouseenter", "op-cercles", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "op-cercles", () => { map.getCanvas().style.cursor = ""; });

  // --- Contrôle cadastre / foncier (haut droit) ---
  class ControleCadastreFoncier {
    onAdd(mapInstance) {
      this._map = mapInstance;
      this._div = document.createElement("div");
      this._div.className = "maplibregl-ctrl controle-cadastre";
      this._div.innerHTML = `
        <label><input type="checkbox" id="toggle-cadastre"> Cadastre</label>
        <label><input type="checkbox" id="toggle-foncier"> Foncier repéré</label>
        <div class="groupe-titre">Dureté</div>
        <div class="legende-item"><span class="legende-swatch" style="background:${COULEUR_DURETE.forte}"></span>Forte</div>
        <div class="legende-item"><span class="legende-swatch" style="background:${COULEUR_DURETE.faible}"></span>Faible</div>
        <div class="groupe-titre">Enjeu (hachures)</div>
        <div class="legende-item"><span class="legende-swatch" style="background:repeating-linear-gradient(45deg,rgba(0,0,0,0.55) 0 2px,transparent 2px 6px)"></span>Fort</div>
        <div class="legende-item"><span class="legende-swatch" style="background:repeating-linear-gradient(45deg,rgba(0,0,0,0.25) 0 1.5px,transparent 1.5px 8px)"></span>Faible</div>
      `;
      return this._div;
    }
    onRemove() { this._div.remove(); this._map = undefined; }
  }
  map.addControl(new ControleCadastreFoncier(), "top-right");

  document.getElementById("toggle-cadastre").addEventListener("change", e => {
    map.setLayoutProperty("cadastre", "visibility", e.target.checked ? "visible" : "none");
  });

  document.getElementById("toggle-foncier").addEventListener("change", async e => {
    const checkbox = e.target;
    const idsCalque = ["foncier-remplissage", "foncier-hachure", "foncier-contour"];
    if (checkbox.checked) {
      checkbox.disabled = true;
      await activerCalqueParesseux("foncier");
      checkbox.disabled = false;
      if (checkbox.checked) idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "visible"));
    } else if (calquesParesseux.foncier.charge) {
      idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "none"));
    }
  });
}

function assurerCarte() {
  if (!cartePromise) cartePromise = initCarte();
  return cartePromise;
}

function construirePopupHtml(r) {
  const titre   = r[COL_TITRE]   || "Opération";
  const adresse = r[COL_ADRESSE] || "";
  const commune = r[COL_COMMUNE] || "";
  const statut  = r[COL_STATUT]  || "";
  return `<b>${titre}</b><br>${adresse}<br><span class="popup-commune">${commune}</span>${statut ? "<br>"+statut : ""}`;
}

function ouvrirPopup(rowId, coordonnees, html) {
  if (popupOuvert) popupOuvert.remove();
  popupOuvert = new maplibregl.Popup().setLngLat(coordonnees).setHTML(html).addTo(map);
}

function construireGeoJSON(records) {
  const features = [];
  let featureSelectionnee = null;

  records.forEach(r => {
    const lat = parseFloat(r[COL_LAT]);
    const lon = parseFloat(r[COL_LON]);
    if (!lat || !lon || isNaN(lat) || isNaN(lon)) return;

    const estSelectionne = (r.id === rowIdSelectionne);

    const feature = {
      type: "Feature",
      geometry: { type: "Point", coordinates: [lon, lat] },
      properties: {
        rowId: r.id,
        selectionne: estSelectionne,
        couleurNormal: COULEUR_OP.normal,
        couleurIntense: COULEUR_OP.intense,
        popupHtml: construirePopupHtml(r)
      }
    };

    if (estSelectionne) featureSelectionnee = feature;
    else features.push(feature);
  });

  if (featureSelectionnee) features.push(featureSelectionnee);
  return { type: "FeatureCollection", features };
}

function appliquerSelectionVisuelle(rowId) {
  rowIdSelectionne = rowId;
  map.getSource("op").setData(construireGeoJSON(derniersRecords));
}

async function majMarqueurs(records) {
  derniersRecords = records;
  const geojson = construireGeoJSON(records);
  map.getSource("op").setData(geojson);

  if (geojson.features.length > 0 && rowIdSelectionne === null) {
    const bounds = new maplibregl.LngLatBounds();
    geojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
    map.fitBounds(bounds, { padding: 30, maxZoom: 16 });
  }
}

// ============================================================
// Suivi de visite (compteur privé, table Visites) — mécanisme identique aux autres widgets
// ============================================================
async function enregistrerVisite() {
  try {
    const participants = await grist.docApi.fetchTable(TABLE_PARTICIPANTS);
    if (!participants.id || participants.id.length === 0) {
      console.warn("Widget carte OP : aucune ligne Participants pour cet utilisateur — visite non enregistrée.");
      return;
    }
    const email     = participants[COL_PART_EMAIL][0];
    const nom       = participants[COL_PART_NOM][0];
    const organisme = participants[COL_PART_ORGANISME][0];

    const aujourdhui = new Date().toISOString().slice(0, 10);
    const visites = await grist.docApi.fetchTable(TABLE_VISITES);
    const dejaVisiteAujourdhui = (visites[COL_VISITE_EMAIL] || []).some((e, i) => {
      if (e !== email) return false;
      const timestamp = visites[COL_VISITE_DATE][i];
      if (typeof timestamp !== "number") return false;
      return new Date(timestamp * 1000).toISOString().slice(0, 10) === aujourdhui;
    });
    if (dejaVisiteAujourdhui) return;

    const table = grist.getTable(TABLE_VISITES);
    await table.create({
      fields: {
        [COL_VISITE_EMAIL]:     email,
        [COL_VISITE_NOM]:       nom,
        [COL_VISITE_ORGANISME]: organisme,
        [COL_VISITE_DATE]:      Math.floor(Date.now() / 1000),
      },
    });
    console.info("Widget carte OP : visite enregistrée pour", nom || email);
  } catch (e) {
    console.warn("Widget carte OP : enregistrement de la visite échoué (non bloquant) :", e);
  }
}

// ============================================================
// API Grist
// ============================================================
grist.ready({ requiredAccess: "full", allowSelectBy: true });

enregistrerVisite();

grist.onRecords(records => {
  assurerCarte().then(() => majMarqueurs(records));
});

grist.onRecord(record => {
  assurerCarte().then(() => {
    if (!record) return;
    appliquerSelectionVisuelle(record.id);
    const feature = derniersRecords.find(r => r.id === record.id);
    const lat = feature && parseFloat(feature[COL_LAT]);
    const lon = feature && parseFloat(feature[COL_LON]);
    if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
      map.easeTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 15) });
      ouvrirPopup(record.id, [lon, lat], construirePopupHtml(record));
    }
  });
});

window.addEventListener("load", () => { assurerCarte(); });
</script>
</body>
</html>
