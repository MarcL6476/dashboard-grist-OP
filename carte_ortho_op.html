<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte suivi OP — Foncier repéré</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
  #map { height: 100%; width: 100%; }

  /* ---------- Popups : fond teinté selon le marqueur (variable --popup-bg) ---------- */
  .maplibregl-popup-content { font-size: 13px; line-height: 1.6; min-width: 180px; padding: 10px 12px; background: var(--popup-bg, rgba(255, 255, 255, 0.88)); }
  .maplibregl-popup-content b { color: var(--popup-titre, #1a5fb4); font-size: 14px; }
  .popup-commune { color: #666; font-size: 12px; }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--popup-bg, rgba(255, 255, 255, 0.88)); }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--popup-bg, rgba(255, 255, 255, 0.88)); }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--popup-bg, rgba(255, 255, 255, 0.88)); }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--popup-bg, rgba(255, 255, 255, 0.88)); }

  .popup-agree    { --popup-bg: rgba(227, 237, 249, 0.92); --popup-titre: #1a5fb4; }
  .popup-previ    { --popup-bg: rgba(255, 246, 204, 0.92); --popup-titre: #7a5c00; }
  .popup-prospect { --popup-bg: rgba(253, 230, 229, 0.92); --popup-titre: #b71c1c; }
  .popup-foncier  { --popup-bg: rgba(226, 246, 229, 0.92); --popup-titre: #1b7a2b; }
  .popup-pb-at    { --popup-bg: rgba(241, 230, 248, 0.92); --popup-titre: #6c3483; }
  .popup-pb-st    { --popup-bg: rgba(248, 228, 237, 0.92); --popup-titre: #8a2a53; }

  /* Popup compact (prospects) : épouse la largeur du texte */
  .popup-compact .maplibregl-popup-content { min-width: 0; padding: 4px 8px; font-size: 11px; line-height: 1.3; }
  .popup-compact .maplibregl-popup-content b { font-size: 12px; }

  /* ---------- Légende (semi-transparente) ---------- */
  .controle-legende {
    background: rgba(255, 255, 255, 0.8);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    padding: 6px 10px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 10px;
  }
  .controle-legende label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    white-space: nowrap;
  }
  .controle-legende .groupe-titre {
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    color: #555;
    margin-top: 4px;
  }
  .controle-legende .legende-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #333;
  }
  .legende-swatch { width: 13px; height: 13px; border: 1px solid rgba(0,0,0,0.3); flex: none; }
  .legende-pastille { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.3); flex: none; }
  .controle-legende select { font-size: 12px; max-width: 210px; padding: 2px; }
</style>
</head>
<body>
<div id="map"></div>

<script>
// ============================================================
// NOMS DES COLONNES — noms LOGIQUES du widget.
// Dans Grist (panneau de droite → Colonnes visibles), on associe chacun
// de ces champs à la colonne réelle de la table FULL_CAPBP.
// ============================================================
const COL_LAT     = "latitude";
const COL_LON     = "longitude";
const COL_TITRE   = "Libelle";              // libellé opération
const COL_ADRESSE = "Adresse_normalisee";
const COL_COMMUNE = "Commune";
const COL_STATUT  = "Statut";               // statut de l'opération : PREVI ou AGREE (colonne STATUT)

const CENTRE_DEFAUT = [-1.10, 43.38]; // MapLibre attend [lon, lat]
const ZOOM_DEFAUT   = 10;

// --- Table secondaire de points : Prospects_PB_2026 (lue par son nom, en dur).
// Les colonnes sont détectées automatiquement parmi ces candidats (insensible à la casse).
// Si une colonne n'est pas trouvée, ajoute son nom exact en tête de la liste correspondante.
const TABLE_PROSPECTS = "Prospects_PB_2026";
// Candidats de noms de colonnes, communs aux 3 séries de points (Prospects, PB_AT, PB_ST).
const CANDIDATS_COLONNES_SERIE = {
  lat:     ["latitude", "lat", "y"],
  lon:     ["longitude", "lon", "lng", "long", "x"],
  titre:   ["Libelle", "Nom", "Intitule", "Titre", "Proprietaire", "Adresse_normalisee", "Adresse"],
  adresse: ["Adresse_normalisee", "Adresse"],
  commune: ["Commune", "nom_com", "Ville"],
  statut:  ["Statut", "Etat"]
};
// Prospects : carré avec contour blanc et intérieur transparent (icône SVG, pas un cercle plein).
const COULEUR_PROSPECTS = "#ffffff"; // couleur du contour
const TAILLE_ICONE_PROSPECTS = 20;   // résolution de base des images (px) ; mise à l'échelle ensuite via icon-size
// Contour "progressif" : 3 images à la même résolution de base, mais avec un contour de plus en
// plus épais par rapport à la taille du carré (7,5 % puis 17,5 % puis 30 %). On bascule de l'une
// à l'autre selon le zoom (icon-image en "step"), en plus de la taille qui grandit déjà avec
// TAILLE_PROSPECTS — sans ça, le contour grossirait toujours dans la même proportion que le
// carré et resterait aussi difficile à distinguer à fort zoom qu'à faible zoom.
const PALIERS_CONTOUR_PROSPECTS = [
  { id: "carre-prospects-fin",   epaisseur: 1.5 },  // zoom < 14
  { id: "carre-prospects-moyen", epaisseur: 3.5 },  // 14 ≤ zoom < 18
  { id: "carre-prospects-epais", epaisseur: 6 }      // zoom ≥ 18
];
const ICONE_PROSPECTS_SELON_ZOOM = ["step", ["zoom"],
  PALIERS_CONTOUR_PROSPECTS[0].id,
  14, PALIERS_CONTOUR_PROSPECTS[1].id,
  18, PALIERS_CONTOUR_PROSPECTS[2].id
];
// Taille affichée (multiplicateur de TAILLE_ICONE_PROSPECTS), croissante avec le zoom — même
// logique que pour les marqueurs ronds : une taille fixe deviendrait minuscule une fois zoomé
// sur une parcelle.
const TAILLE_PROSPECTS = ["interpolate", ["linear"], ["zoom"], 10, 0.4, 14, 0.6, 18, 1.0];

// --- Séries de points supplémentaires (tables PB_AT et PB_ST), mêmes colonnes détectées que les prospects.
// Rayon intermédiaire : plus gros que les prospects, plus petit que les OP à faible zoom, et
// croît lui aussi avec le zoom pour rester visible.
const RAYON_PB = ["interpolate", ["linear"], ["zoom"], 10, 5, 14, 7, 18, 11];

// --- Rayons des marqueurs OP (opérations agréées/prévi), croissants avec le zoom eux aussi,
// pour qu'ils restent visuellement plus gros que les Prospects et PB à tous les niveaux de zoom.
const RAYON_OP            = ["interpolate", ["linear"], ["zoom"], 10, 6, 14, 9,  18, 13];
const RAYON_OP_SELECTION  = ["interpolate", ["linear"], ["zoom"], 10, 9, 14, 12, 18, 16];
// Même famille de teintes (froides) pour PB_AT et PB_ST, afin qu'aucune des deux ne ressorte
// plus que l'autre — contrairement à l'ancien violet/orange, trop contrastés entre eux.
const SERIES_PB = [
  { cle: "pb-at", table: "PB_AT", libelle: "PB_AT", couleur: "#7B52AB", classePopup: "popup-pb-at" }, // violet
  { cle: "pb-st", table: "PB_ST", libelle: "PB_ST", couleur: "#B23A72", classePopup: "popup-pb-st" }  // magenta-rose
];

// --- Fond de carte : orthophotographie IGN Géoplateforme (WMTS), gratuite et sans clé ---
const STYLE_FOND_ORTHO = {
  version: 8,
  // Polices nécessaires uniquement pour la couche « Noms des opérations »
  glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
  sources: {
    ortho: {
      type: "raster",
      tiles: [
        "https://data.geopf.fr/wmts?layer=ORTHOIMAGERY.ORTHOPHOTOS&style=normal&tilematrixset=PM&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}"
      ],
      tileSize: 256,
      minzoom: 0,
      maxzoom: 19
    }
  },
  layers: [{ id: "ortho", type: "raster", source: "ortho" }]
};

// --- Foncier repéré : lu depuis la table Grist "Foncier_repere" (calque paresseux "foncier").
// Seuls les secteurs dont la colonne "strategie" vaut "à enjeu" sont affichés.
const TABLE_FONCIER = "Foncier_repere";
const COL_FONCIER_STRATEGIE = "strategie";
const VALEUR_FONCIER_AFFICHEE = "à enjeu";
const COULEUR_FONCIER = "#2ECC40"; // vert
const HACHURE_ENJEUX  = { tuile: 8, epaisseur: 1.5 };

// --- Couleurs des marqueurs OP selon la colonne STATUT ---
// Tout autre statut (ou statut vide) est affiché comme AGREE.
const COULEURS_STATUT_OP = {
  AGREE: { normal: "#1a5fb4", intense: "#0d3b73", classePopup: "popup-agree" },
  PREVI: { normal: "#FFD21F", intense: "#F5B800", classePopup: "popup-previ" }
};
function couleursPourStatut(statut) {
  const s = String(statut || "").trim().toUpperCase();
  return COULEURS_STATUT_OP[s] || COULEURS_STATUT_OP.AGREE;
}
// ============================================================

let map;
let popupOuvert = null;
let rowIdSelectionne = null;
let cartePromise = null;
let cadrageInitialFait = false;
let featuresOPParId = new Map();
let communeFiltre = null;        // clé normalisée de la commune isolée (null = toutes)
let derniersFeaturesOP = [];
let featuresParSerie = {};      // points des séries (prospects, PB_AT, PB_ST), pour le cadrage par commune
let signatureCommunes = "";

// ============================================================
// Utilitaires
// ============================================================
function echapperHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Accepte les nombres, les textes et les virgules décimales ("43,38"). Renvoie NaN si invalide ou nul.
function lireCoordonnee(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return (!n || isNaN(n)) ? NaN : n;
}

function normaliserTexte(v) {
  if (Array.isArray(v)) v = v.filter(x => x !== "L").join(" "); // liste de choix Grist
  return String(v == null ? "" : v).normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
}

// Clé de comparaison des communes : sans accents, casse, tirets ni apostrophes.
function cleCommune(v) {
  return normaliserTexte(v).replace(/[-'’]/g, " ").replace(/\s+/g, " ").trim();
}

// Contenu d'un popup : chaque ligne n'est ajoutée que si elle est renseignée.
function construireContenuPopup(titre, adresse, commune, statut) {
  return `<b>${echapperHtml(titre)}</b>`
    + (adresse ? `<br>${echapperHtml(adresse)}` : "")
    + (commune ? `<br><span class="popup-commune">${echapperHtml(commune)}</span>` : "")
    + (statut  ? `<br>${echapperHtml(statut)}` : "");
}

// Un seul popup ouvert à la fois, quel que soit le type de calque.
function ouvrirPopup(coordonnees, html, classe, options) {
  if (popupOuvert) popupOuvert.remove();
  popupOuvert = new maplibregl.Popup(Object.assign({ className: classe || "" }, options || {}))
    .setLngLat(coordonnees)
    .setHTML(html)
    .addTo(map);
}

function curseurMainSurCalque(idCalque) {
  map.on("mouseenter", idCalque, () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", idCalque, () => { map.getCanvas().style.cursor = ""; });
}

// ============================================================
// Calques "paresseux" : téléchargés au premier clic sur la case correspondante,
// jamais au chargement de la carte, puis gardés en mémoire pour la session.
// ============================================================
const calquesParesseux = {};

function declarerCalqueParesseux(nom, fonctionChargement) {
  calquesParesseux[nom] = { charge: false, enCours: null, fonctionChargement };
}

async function activerCalqueParesseux(nom) {
  const entree = calquesParesseux[nom];
  if (!entree || entree.charge) return;
  if (!entree.enCours) {
    entree.enCours = entree.fonctionChargement();
  }
  try {
    await entree.enCours;
    entree.charge = true;
  } catch (err) {
    console.error(`Erreur chargement du calque paresseux '${nom}' :`, err);
    entree.enCours = null;
  }
}

// ============================================================
// Motif de hachures : image SVG (data URI) chargée via Image()
// puis enregistrée avec map.addImage. Les mêmes constantes servent
// pour la légende et pour la carte.
// ============================================================
function creerDataUriHachure(tailleTuile, epaisseur, couleur) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${tailleTuile}" height="${tailleTuile}">
    <line x1="0" y1="${tailleTuile}" x2="${tailleTuile}" y2="0" stroke="${couleur}" stroke-width="${epaisseur}" stroke-opacity="1"/>
  </svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

function chargerImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function enregistrerImagesHachures() {
  if (!map.hasImage("hachure-enjeux")) {
    const img = await chargerImage(creerDataUriHachure(HACHURE_ENJEUX.tuile, HACHURE_ENJEUX.epaisseur, COULEUR_FONCIER));
    map.addImage("hachure-enjeux", img);
  }
}

// Carré creux (contour seul, intérieur transparent) pour l'icône des Prospects.
function creerDataUriCarre(taille, epaisseur, couleur) {
  const demi = epaisseur / 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${taille}" height="${taille}">
    <rect x="${demi}" y="${demi}" width="${taille - epaisseur}" height="${taille - epaisseur}" fill="none" stroke="${couleur}" stroke-width="${epaisseur}"/>
  </svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

async function enregistrerIconesProspects() {
  for (const palier of PALIERS_CONTOUR_PROSPECTS) {
    if (map.hasImage(palier.id)) continue;
    const img = await chargerImage(creerDataUriCarre(TAILLE_ICONE_PROSPECTS, palier.epaisseur, COULEUR_PROSPECTS));
    map.addImage(palier.id, img);
  }
}

// Convertit le résultat colonne-orienté de grist.docApi.fetchTable("Foncier_repere")
// en FeatureCollection GeoJSON, en ne gardant que les secteurs "à enjeu".
function construireGeoJSONFoncier(donnees) {
  const features = [];
  const nbLignes = (donnees.id || []).length;
  const cle = Object.keys(donnees).find(k => normaliserTexte(k) === normaliserTexte(COL_FONCIER_STRATEGIE));
  if (!cle) {
    console.warn(`Foncier : colonne '${COL_FONCIER_STRATEGIE}' introuvable. Colonnes disponibles :`, Object.keys(donnees));
    return { type: "FeatureCollection", features, diagnostic: `colonne '${COL_FONCIER_STRATEGIE}' introuvable` };
  }
  const cible = normaliserTexte(VALEUR_FONCIER_AFFICHEE);
  const valeursVues = new Set();
  for (let i = 0; i < nbLignes; i++) {
    valeursVues.add(JSON.stringify(donnees[cle][i]));
    if (normaliserTexte(donnees[cle][i]) !== cible) continue;
    const geometrieBrute = donnees.geometrie_json && donnees.geometrie_json[i];
    if (!geometrieBrute) continue;
    let geometry;
    try {
      geometry = JSON.parse(geometrieBrute);
    } catch (e) {
      console.warn("Géométrie foncier illisible pour la ligne", donnees.id[i], e);
      continue;
    }
    features.push({
      type: "Feature",
      geometry,
      properties: {
        final: donnees.final ? donnees.final[i] : null,
        nom_com: donnees.nom_com ? donnees.nom_com[i] : null,
        communeCle: cleCommune(donnees.nom_com ? donnees.nom_com[i] : null),
        surf_m2: donnees.surf_m2 ? donnees.surf_m2[i] : null,
      }
    });
  }
  console.info(`Foncier : ${features.length} secteur(s) '${VALEUR_FONCIER_AFFICHEE}' sur ${nbLignes} ligne(s). Valeurs de '${cle}' :`, [...valeursVues]);
  const diagnostic = features.length ? "" : `aucune ligne '${VALEUR_FONCIER_AFFICHEE}' dans '${cle}' (${[...valeursVues].slice(0, 4).join(", ")})`;
  return { type: "FeatureCollection", features, diagnostic };
}

// ============================================================
// Prospects : lecture de la table Prospects_PB_2026 → points GeoJSON
// ============================================================
function trouverColonne(donnees, candidats) {
  const cles = Object.keys(donnees);
  for (const c of candidats) {
    const k = cles.find(cle => cle.toLowerCase() === c.toLowerCase());
    if (k) return k;
  }
  return null;
}

async function chargerSeriePoints(table, idSource, titreDefaut) {
  const donnees = await grist.docApi.fetchTable(table);
  const cLat = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.lat);
  const cLon = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.lon);
  if (!cLat || !cLon) {
    console.warn(`${table} : colonnes latitude/longitude introuvables. Colonnes disponibles :`, Object.keys(donnees));
    return;
  }
  const cTitre   = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.titre);
  const cAdresse = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.adresse);
  const cCommune = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.commune);
  const cStatut  = trouverColonne(donnees, CANDIDATS_COLONNES_SERIE.statut);

  const features = [];
  const nb = (donnees.id || []).length;
  for (let i = 0; i < nb; i++) {
    const lat = lireCoordonnee(donnees[cLat][i]);
    const lon = lireCoordonnee(donnees[cLon][i]);
    if (isNaN(lat) || isNaN(lon)) continue;
    const titre   = (cTitre   && donnees[cTitre][i])   || titreDefaut;
    const adresse = (cAdresse && cAdresse !== cTitre && donnees[cAdresse][i]) || "";
    const commune = (cCommune && donnees[cCommune][i]) || "";
    const statut  = (cStatut  && donnees[cStatut][i])  || "";
    features.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [lon, lat] },
      properties: { popupHtml: construireContenuPopup(titre, adresse, commune, statut), communeCle: cleCommune(commune) }
    });
  }
  map.getSource(idSource).setData({ type: "FeatureCollection", features });
  featuresParSerie[idSource] = features;
  console.info(`${table} : ${features.length} point(s) affiché(s) sur ${nb} ligne(s).`);
}

// ============================================================
// Opérations (table FULL_CAPBP via le mappage de colonnes Grist)
// ============================================================
function construireContenuPopupOP(r) {
  return construireContenuPopup(r[COL_TITRE] || "Opération", r[COL_ADRESSE], r[COL_COMMUNE], r[COL_STATUT]);
}

function construireGeoJSONOP(records) {
  const features = [];
  featuresOPParId = new Map();
  records.forEach(r => {
    const lat = lireCoordonnee(r[COL_LAT]);
    const lon = lireCoordonnee(r[COL_LON]);
    if (isNaN(lat) || isNaN(lon)) return;
    const c = couleursPourStatut(r[COL_STATUT]);
    const feature = {
      type: "Feature",
      geometry: { type: "Point", coordinates: [lon, lat] },
      properties: {
        rowId: r.id,
        couleurNormal: c.normal,
        couleurIntense: c.intense,
        classePopup: c.classePopup,
        libelle: r[COL_TITRE] || "",
        communeCle: cleCommune(r[COL_COMMUNE]),
        popupHtml: construireContenuPopupOP(r)
      }
    };
    features.push(feature);
    featuresOPParId.set(r.id, feature);
  });
  return { type: "FeatureCollection", features };
}

// La sélection ne met à jour qu'un seul point (couche dédiée), pas toute la source.
function appliquerSelectionVisuelle(rowId) {
  rowIdSelectionne = rowId;
  const f = featuresOPParId.get(rowId);
  map.getSource("op-selection").setData({ type: "FeatureCollection", features: f ? [f] : [] });
}

// ---------- Filtre par commune (affichage uniquement) ----------
// Les calques des séries PB sont déduits de SERIES_PB (serie.cle + "-cercles") : une série
// ajoutée là-bas est automatiquement filtrée par commune ici, sans modification à faire.
const CALQUES_FILTRABLES = ["op-cercles", "op-selection", "op-noms", "prospects-cercles",
                            ...SERIES_PB.map(serie => serie.cle + "-cercles"),
                            "foncier-remplissage", "foncier-hachure", "foncier-contour"];

function appliquerFiltreCommune() {
  const filtre = communeFiltre ? ["==", ["get", "communeCle"], communeFiltre] : null;
  CALQUES_FILTRABLES.forEach(id => { if (map.getLayer(id)) map.setFilter(id, filtre); });
}

// Liste des communes : celles présentes dans les opérations de FULL_CAPBP (Agglo de Pau).
function remplirListeCommunes(records) {
  const select = document.getElementById("select-commune");
  if (!select) return;
  const communes = new Map();
  records.forEach(r => {
    const cle = cleCommune(r[COL_COMMUNE]);
    if (cle && !communes.has(cle)) communes.set(cle, String(r[COL_COMMUNE]).trim());
  });
  const tri = [...communes.entries()].sort((a, b) => a[1].localeCompare(b[1], "fr"));
  const signature = tri.map(c => c[0]).join("|");
  if (signature === signatureCommunes) return;
  signatureCommunes = signature;
  if (communeFiltre && !communes.has(communeFiltre)) {
    communeFiltre = null;
    appliquerFiltreCommune();
  }
  select.innerHTML = `<option value="">Toutes les communes</option>`
    + tri.map(([cle, nom]) => `<option value="${echapperHtml(cle)}">${echapperHtml(nom)}</option>`).join("");
  select.value = communeFiltre || "";
}

function cadrerSurCommune() {
  const points = [];
  derniersFeaturesOP.forEach(f => {
    if (!communeFiltre || f.properties.communeCle === communeFiltre) points.push(f.geometry.coordinates);
  });
  if (communeFiltre) {
    Object.values(featuresParSerie).flat().forEach(f => {
      if (f.properties.communeCle === communeFiltre) points.push(f.geometry.coordinates);
    });
  }
  if (!points.length) return;
  const bounds = new maplibregl.LngLatBounds();
  points.forEach(c => bounds.extend(c));
  map.fitBounds(bounds, { padding: 40, maxZoom: 15 });
}

function majMarqueurs(records) {
  const geojson = construireGeoJSONOP(records);
  map.getSource("op").setData(geojson);
  derniersFeaturesOP = geojson.features;
  remplirListeCommunes(records);
  if (rowIdSelectionne !== null) appliquerSelectionVisuelle(rowIdSelectionne);

  // Cadrage automatique uniquement au premier chargement
  if (!cadrageInitialFait && geojson.features.length > 0 && rowIdSelectionne === null) {
    const bounds = new maplibregl.LngLatBounds();
    geojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
    map.fitBounds(bounds, { padding: 30, maxZoom: 16 });
    cadrageInitialFait = true;
  }
}

// ============================================================
// Initialisation de la carte
// ============================================================
async function initCarte() {
  map = new maplibregl.Map({
    container: "map",
    style: STYLE_FOND_ORTHO,
    center: CENTRE_DEFAUT,
    zoom: ZOOM_DEFAUT,
    attributionControl: false
  });
  map.addControl(new maplibregl.AttributionControl({
    customAttribution: "© IGN — Orthophotographies"
  }));

  await new Promise(resolve => map.on("load", resolve));

  // --- Cadastre DGFiP (raster WMTS IGN) — ajouté caché, affiché via la case, sans opacité réduite ---
  map.addSource("cadastre", {
    type: "raster",
    tiles: [
      "https://data.geopf.fr/wmts?layer=CADASTRALPARCELS.PARCELLAIRE_EXPRESS&style=PCI%20vecteur&tilematrixset=PM_0_19&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}"
    ],
    tileSize: 256,
    minzoom: 0,
    maxzoom: 22
  });
  map.addLayer({
    id: "cadastre",
    type: "raster",
    source: "cadastre",
    layout: { visibility: "none" }
  });

  // --- Prospects (table Prospects_PB_2026) : carrés à contour blanc, intérieur transparent.
  // L'id de calque "prospects-cercles" est conservé tel quel (filtre commune, clic, case à
  // cocher en dépendent) même si ce n'est plus un cercle, pour limiter l'ampleur du changement.
  await enregistrerIconesProspects();
  map.addSource("prospects", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "prospects-cercles",
    type: "symbol",
    source: "prospects",
    layout: {
      "icon-image": ICONE_PROSPECTS_SELON_ZOOM,
      "icon-size": TAILLE_PROSPECTS,
      "icon-allow-overlap": true,
      "icon-ignore-placement": true
    }
  });
  map.on("click", "prospects-cercles", e => {
    const f = e.features[0];
    ouvrirPopup(f.geometry.coordinates, f.properties.popupHtml, "popup-compact popup-prospect", { closeButton: false, maxWidth: "220px" });
  });
  curseurMainSurCalque("prospects-cercles");
  chargerSeriePoints(TABLE_PROSPECTS, "prospects", "Prospect")
    .catch(err => console.warn(`Prospects : lecture de ${TABLE_PROSPECTS} impossible (non bloquant) :`, err));

  // --- Séries PB_AT et PB_ST : points de taille intermédiaire, une couleur par série, sans contour ---
  SERIES_PB.forEach(serie => {
    const idCalque = serie.cle + "-cercles";
    map.addSource(serie.cle, { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: idCalque,
      type: "circle",
      source: serie.cle,
      paint: {
        "circle-radius": RAYON_PB,
        "circle-color": serie.couleur,
        "circle-opacity": 0.85,
        "circle-stroke-width": 0
      }
    });
    map.on("click", idCalque, e => {
      const f = e.features[0];
      ouvrirPopup(f.geometry.coordinates, f.properties.popupHtml, "popup-compact " + serie.classePopup, { closeButton: false, maxWidth: "220px" });
    });
    curseurMainSurCalque(idCalque);
    chargerSeriePoints(serie.table, serie.cle, serie.libelle)
      .catch(err => console.warn(`${serie.table} : lecture impossible (non bloquant) :`, err));
  });

  // --- Foncier repéré (table Grist "Foncier_repere", paresseux) ---
  declarerCalqueParesseux("foncier", async () => {
    const donnees = await grist.docApi.fetchTable(TABLE_FONCIER);
    const geojson = construireGeoJSONFoncier(donnees);

    const note = document.getElementById("foncier-note");
    if (note) note.textContent = geojson.diagnostic ? "⚠ " + geojson.diagnostic : "";

    await enregistrerImagesHachures();
    map.addSource("foncier", { type: "geojson", data: geojson });

    // Inséré sous les marqueurs : foncier (couleur, hachures, contour) < prospects < OP
    map.addLayer({
      id: "foncier-remplissage",
      type: "fill",
      source: "foncier",
      paint: { "fill-color": COULEUR_FONCIER, "fill-opacity": 0.15 },
      layout: { visibility: "none" }
    }, "prospects-cercles");
    map.addLayer({
      id: "foncier-hachure",
      type: "fill",
      source: "foncier",
      paint: { "fill-pattern": "hachure-enjeux", "fill-opacity": 1 },
      layout: { visibility: "none" }
    }, "prospects-cercles");
    map.addLayer({
      id: "foncier-contour",
      type: "line",
      source: "foncier",
      paint: { "line-color": COULEUR_FONCIER, "line-width": 1.5 },
      layout: { visibility: "none" }
    }, "prospects-cercles");

    map.on("click", "foncier-remplissage", e => {
      const p = e.features[0].properties;
      const surface = p.surf_m2 ? "Surface : " + Math.round(p.surf_m2).toLocaleString("fr-FR") + " m²" : "";
      ouvrirPopup(e.lngLat, construireContenuPopup(p.final || "Secteur à enjeu", p.nom_com, surface, ""), "popup-foncier");
    });
    curseurMainSurCalque("foncier-remplissage");
    appliquerFiltreCommune();
  });

  // --- Marqueurs OP : même rayon et même contour blanc pour tous les statuts ---
  map.addSource("op", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "op-cercles",
    type: "circle",
    source: "op",
    paint: {
      "circle-radius": RAYON_OP,
      "circle-color": ["get", "couleurNormal"],
      "circle-opacity": 0.55,
      "circle-stroke-color": "#ffffff",
      "circle-stroke-width": 1.5,
      "circle-stroke-opacity": 1
    }
  });

  // Couche dédiée au marqueur sélectionné (au-dessus, plus grand, plus intense)
  map.addSource("op-selection", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "op-selection",
    type: "circle",
    source: "op-selection",
    paint: {
      "circle-radius": RAYON_OP_SELECTION,
      "circle-color": ["get", "couleurIntense"],
      "circle-opacity": 0.85,
      "circle-stroke-color": "#ffffff",
      "circle-stroke-width": 2.5,
      "circle-stroke-opacity": 1
    }
  });

  map.on("click", "op-cercles", e => {
    const f = e.features[0];
    const rowId = f.properties.rowId;
    appliquerSelectionVisuelle(rowId);
    ouvrirPopup(f.geometry.coordinates, f.properties.popupHtml, f.properties.classePopup);
    grist.setCursorPos({ rowId });
  });
  curseurMainSurCalque("op-cercles");

  // --- Noms des opérations (étiquettes discrètes, masquées par défaut) ---
  map.addLayer({
    id: "op-noms",
    type: "symbol",
    source: "op",
    minzoom: 12,
    layout: {
      visibility: "none",
      "text-field": ["get", "libelle"],
      "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
      "text-size": 10,
      "text-anchor": "top",
      "text-offset": [0, 0.9],
      "text-max-width": 8,
      "text-padding": 3,
      "text-allow-overlap": false,
      "text-optional": true
    },
    paint: {
      "text-color": "#1b1b1b",
      "text-halo-color": "rgba(255,255,255,0.95)",
      "text-halo-width": 1.5
    }
  });

  // --- Contrôle foncier / prospects / opérations + légende (haut droit) ---
  const pastilleOP = statut => `<span class="legende-pastille" style="background:${COULEURS_STATUT_OP[statut].normal}"></span>`;
  class ControleLegende {
    onAdd(mapInstance) {
      this._map = mapInstance;
      this._div = document.createElement("div");
      this._div.className = "maplibregl-ctrl controle-legende";
      this._div.innerHTML = `
        <div class="groupe-titre" style="margin-top:0">Commune</div>
        <select id="select-commune"><option value="">Toutes les communes</option></select>
        <label><input type="checkbox" id="toggle-cadastre"> Cadastre</label>
        <label><input type="checkbox" id="toggle-foncier"> Foncier repéré</label>
        <div class="legende-item" style="margin-left:20px"><span class="legende-swatch" style="background-color:rgba(46,204,64,0.15);background-image:url('${creerDataUriHachure(HACHURE_ENJEUX.tuile, HACHURE_ENJEUX.epaisseur, COULEUR_FONCIER)}');background-repeat:repeat;background-size:${HACHURE_ENJEUX.tuile}px ${HACHURE_ENJEUX.tuile}px;border-color:${COULEUR_FONCIER}"></span>Secteurs à enjeux repérés</div>
        <div id="foncier-note" style="margin-left:20px;max-width:220px;font-size:10px;color:#c01c28;white-space:normal"></div>
        <label><input type="checkbox" id="toggle-prospects" checked> <span class="legende-swatch" style="background:rgba(0,0,0,0.35);border:2px solid ${COULEUR_PROSPECTS};width:9px;height:9px"></span> Prospects 2026</label>
        ${SERIES_PB.map(serie => `<label><input type="checkbox" id="toggle-${serie.cle}" checked> <span class="legende-swatch" style="background:${serie.couleur};border-radius:50%;width:10px;height:10px"></span> ${serie.libelle}</label>`).join("")}
        <div class="groupe-titre">Opérations</div>
        <div class="legende-item">${pastilleOP("AGREE")}Agréée</div>
        <div class="legende-item">${pastilleOP("PREVI")}Prévisionnelle 2026/28</div>
        <label><input type="checkbox" id="toggle-noms"> Noms des opérations</label>
      `;
      return this._div;
    }
    onRemove() { this._div.remove(); this._map = undefined; }
  }
  map.addControl(new ControleLegende(), "top-right");

  document.getElementById("toggle-cadastre").addEventListener("change", e => {
    map.setLayoutProperty("cadastre", "visibility", e.target.checked ? "visible" : "none");
  });

  document.getElementById("toggle-prospects").addEventListener("change", e => {
    map.setLayoutProperty("prospects-cercles", "visibility", e.target.checked ? "visible" : "none");
  });

  SERIES_PB.forEach(serie => {
    document.getElementById("toggle-" + serie.cle).addEventListener("change", e => {
      map.setLayoutProperty(serie.cle + "-cercles", "visibility", e.target.checked ? "visible" : "none");
    });
  });

  document.getElementById("toggle-noms").addEventListener("change", e => {
    map.setLayoutProperty("op-noms", "visibility", e.target.checked ? "visible" : "none");
  });

  document.getElementById("select-commune").addEventListener("change", e => {
    communeFiltre = e.target.value || null;
    if (popupOuvert) { popupOuvert.remove(); popupOuvert = null; }
    appliquerFiltreCommune();
    cadrerSurCommune();
  });

  document.getElementById("toggle-foncier").addEventListener("change", async e => {
    const checkbox = e.target;
    const idsCalque = ["foncier-remplissage", "foncier-hachure", "foncier-contour"];
    if (checkbox.checked) {
      checkbox.disabled = true;
      await activerCalqueParesseux("foncier");
      checkbox.disabled = false;
      if (checkbox.checked && calquesParesseux.foncier.charge) {
        idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "visible"));
      }
    } else if (calquesParesseux.foncier.charge) {
      idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "none"));
    }
  });
}

function assurerCarte() {
  if (!cartePromise) cartePromise = initCarte();
  return cartePromise;
}

// ============================================================
// API Grist — avec mappage de colonnes (panneau « Colonnes visibles »)
// ============================================================
grist.ready({
  requiredAccess: "full",
  allowSelectBy: true,
  columns: [
    { name: COL_LAT,     title: "Latitude",  type: "Any" },
    { name: COL_LON,     title: "Longitude", type: "Any" },
    { name: COL_TITRE,   title: "Titre",     type: "Any", optional: true },
    { name: COL_ADRESSE, title: "Adresse",   type: "Any", optional: true },
    { name: COL_COMMUNE, title: "Commune",   type: "Any", optional: true },
    { name: COL_STATUT,  title: "Statut (PREVI / AGREE)", type: "Any", optional: true }
  ]
});

grist.onRecords(records => {
  const mapped = grist.mapColumnNames(records);
  if (!mapped) return; // colonnes pas encore associées dans Grist
  assurerCarte().then(() => majMarqueurs(mapped));
});

grist.onRecord(record => {
  const mapped = grist.mapColumnNames(record);
  if (!mapped) return;
  assurerCarte().then(() => {
    // Commune isolée : une ligne d'une autre commune ne déclenche rien
    if (communeFiltre && cleCommune(mapped[COL_COMMUNE]) !== communeFiltre) return;
    appliquerSelectionVisuelle(mapped.id);
    const lat = lireCoordonnee(mapped[COL_LAT]);
    const lon = lireCoordonnee(mapped[COL_LON]);
    if (!isNaN(lat) && !isNaN(lon)) {
      map.easeTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 15) });
      ouvrirPopup([lon, lat], construireContenuPopupOP(mapped), couleursPourStatut(mapped[COL_STATUT]).classePopup);
    }
  });
});

window.addEventListener("load", () => { assurerCarte(); });
</script>
