<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte suivi OP — Foncier repéré</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
  #map { height: 100%; width: 100%; }
  .maplibregl-popup-content { font-size: 13px; line-height: 1.6; min-width: 180px; padding: 10px 12px; background: rgba(255, 255, 255, 0.88); }
  .maplibregl-popup-content b { color: #1a5fb4; font-size: 14px; }
  .popup-commune { color: #666; font-size: 12px; }
  /* Popup compact (prospects) : épouse la largeur du texte */
  .popup-compact .maplibregl-popup-content { min-width: 0; padding: 4px 8px; font-size: 11px; line-height: 1.3; }
  .popup-compact .maplibregl-popup-content b { font-size: 12px; }
  .controle-cadastre {
    background: white;
    padding: 6px 10px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 10px;
  }
  .controle-cadastre label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    white-space: nowrap;
  }
  .controle-cadastre .groupe-titre {
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    color: #666;
    margin-top: 4px;
  }
  .controle-cadastre .legende-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #444;
  }
  .legende-swatch { width: 13px; height: 13px; border: 1px solid rgba(0,0,0,0.3); flex: none; }
</style>
</head>
<body>
<div id="map"></div>

<script>
// ============================================================
// NOMS DES COLONNES — noms LOGIQUES du widget.
// Dans Grist (panneau de droite → Colonnes visibles), on associe chacun
// de ces champs à la colonne réelle de la table FULL_CAPBP.
// ============================================================
const COL_LAT     = "latitude";
const COL_LON     = "longitude";
const COL_TITRE   = "Libelle";              // libellé opération
const COL_ADRESSE = "Adresse_normalisee";
const COL_COMMUNE = "Commune";
const COL_STATUT  = "Statut";               // statut de l'opération : PREVI ou AGREE (colonne STATUT)

const CENTRE_DEFAUT = [-1.10, 43.38]; // MapLibre attend [lon, lat]
const ZOOM_DEFAUT   = 10;

// --- Table secondaire de points : Prospects_PB_2026 (lue par son nom, en dur).
// Les colonnes sont détectées automatiquement parmi ces candidats (insensible à la casse).
// Si une colonne n'est pas trouvée, ajoute son nom exact en tête de la liste correspondante.
const TABLE_PROSPECTS = "Prospects_PB_2026";
const CANDIDATS_PROSPECTS = {
  lat:     ["latitude", "lat", "y"],
  lon:     ["longitude", "lon", "lng", "long", "x"],
  titre:   ["Libelle", "Nom", "Intitule", "Titre", "Proprietaire", "Adresse_normalisee", "Adresse"],
  adresse: ["Adresse_normalisee", "Adresse"],
  commune: ["Commune", "nom_com", "Ville"],
  statut:  ["Statut", "Etat"]
};
const COULEUR_PROSPECTS = "#E53935"; // rouge
const RAYON_PROSPECTS   = 4;         // plus petit que les OP (6, ou 9 si sélectionné)

// --- Suivi de visite (compteur privé, visible uniquement par le propriétaire du document
// dans la table Visites — voir la fonction enregistrerVisite) ---
const TABLE_PARTICIPANTS  = "Participants";
const TABLE_VISITES       = "Visites";
const COL_PART_EMAIL      = "Email";
const COL_PART_NOM        = "Nom";
const COL_PART_ORGANISME  = "Organisme";
const COL_VISITE_EMAIL      = "Email";
const COL_VISITE_NOM        = "Nom";
const COL_VISITE_ORGANISME  = "Organisme";
const COL_VISITE_DATE       = "Date_Visite";

// --- Fond de carte : orthophotographie IGN Géoplateforme (WMTS), gratuite et sans clé ---
const STYLE_FOND_ORTHO = {
  version: 8,
  // Polices nécessaires uniquement pour la couche « Noms des opérations »
  glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
  sources: {
    ortho: {
      type: "raster",
      tiles: [
        "https://data.geopf.fr/wmts?layer=ORTHOIMAGERY.ORTHOPHOTOS&style=normal&tilematrixset=PM&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}"
      ],
      tileSize: 256,
      minzoom: 0,
      maxzoom: 19
    }
  },
  layers: [{ id: "ortho", type: "raster", source: "ortho" }]
};

// --- Foncier repéré : lu depuis la table Grist "Foncier_repere"
// (colonnes durete, final, geometrie_json, etc.) — voir le calque paresseux "foncier".
const TABLE_FONCIER = "Foncier_repere";

// Seuls les secteurs dont la colonne "strategie" vaut "à enjeu" sont affichés.
const COL_FONCIER_STRATEGIE = "strategie";
const VALEUR_FONCIER_AFFICHEE = "à enjeu";
function normaliserTexte(v) {
  if (Array.isArray(v)) v = v.filter(x => x !== "L").join(" "); // liste de choix Grist
  return String(v == null ? "" : v).normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
}
// ============================================================

let map;
let popupOuvert = null;
let rowIdSelectionne = null;
let derniersRecords = [];
let cartePromise = null;

// --- Couleurs des marqueurs OP selon la colonne STATUT ---
// AGREE : bleu (couleur historique, inchangée) ; PREVI : jaune avec contour plus foncé.
// Tout autre statut (ou statut vide) est affiché comme AGREE.
const COULEURS_STATUT_OP = {
  AGREE: { normal: "#1a5fb4", intense: "#0d3b73", contourNormal: "#1a5fb4", contourIntense: "#0d3b73" },
  PREVI: { normal: "#FFD21F", intense: "#F5B800", contourNormal: "#B38600", contourIntense: "#7A5C00" }
};
function couleursPourStatut(statut) {
  const s = String(statut || "").trim().toUpperCase();
  return COULEURS_STATUT_OP[s] || COULEURS_STATUT_OP.AGREE;
}

// ============================================================
// Calques "paresseux" : téléchargés au premier clic sur la case correspondante,
// jamais au chargement de la carte, puis gardés en mémoire pour la session.
// ============================================================
const calquesParesseux = {};

function declarerCalqueParesseux(nom, fonctionChargement) {
  calquesParesseux[nom] = { charge: false, enCours: null, fonctionChargement };
}

async function activerCalqueParesseux(nom) {
  const entree = calquesParesseux[nom];
  if (!entree || entree.charge) return;
  if (!entree.enCours) {
    entree.enCours = entree.fonctionChargement();
  }
  try {
    await entree.enCours;
    entree.charge = true;
  } catch (err) {
    console.error(`Erreur chargement du calque paresseux '${nom}' :`, err);
    entree.enCours = null;
  }
}

// ============================================================
// Motifs de hachures : image SVG (data URI) chargée via Image()
// puis enregistrée avec map.addImage.
//
// Les mêmes constantes servent pour la légende et pour la carte.
// ============================================================
const HACHURE_ENJEUX  = { tuile: 8, epaisseur: 1.5 };
const COULEUR_FONCIER = "#2ECC40"; // vert

function creerDataUriHachure(tailleTuile, epaisseur, couleur) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${tailleTuile}" height="${tailleTuile}">
    <line x1="0" y1="${tailleTuile}" x2="${tailleTuile}" y2="0" stroke="${couleur}" stroke-width="${epaisseur}" stroke-opacity="1"/>
  </svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

function chargerImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function enregistrerImagesHachures() {
  if (!map.hasImage("hachure-enjeux")) {
    const img = await chargerImage(creerDataUriHachure(HACHURE_ENJEUX.tuile, HACHURE_ENJEUX.epaisseur, COULEUR_FONCIER));
    map.addImage("hachure-enjeux", img);
  }
}

// Convertit le résultat colonne-orienté de grist.docApi.fetchTable("Foncier_repere")
// en FeatureCollection GeoJSON, en ne gardant que les secteurs "à enjeux".
function construireGeoJSONFoncier(donnees) {
  const features = [];
  const nbLignes = (donnees.id || []).length;
  const cle = Object.keys(donnees).find(k => normaliserTexte(k) === normaliserTexte(COL_FONCIER_STRATEGIE));
  if (!cle) {
    console.warn(`Foncier : colonne '${COL_FONCIER_STRATEGIE}' introuvable. Colonnes disponibles :`, Object.keys(donnees));
    return { type: "FeatureCollection", features, diagnostic: `colonne '${COL_FONCIER_STRATEGIE}' introuvable` };
  }
  const cible = normaliserTexte(VALEUR_FONCIER_AFFICHEE);
  const valeursVues = new Set();
  for (let i = 0; i < nbLignes; i++) {
    valeursVues.add(JSON.stringify(donnees[cle][i]));
    if (normaliserTexte(donnees[cle][i]) !== cible) continue;
    const geometrieBrute = donnees.geometrie_json && donnees.geometrie_json[i];
    if (!geometrieBrute) continue;
    let geometry;
    try {
      geometry = JSON.parse(geometrieBrute);
    } catch (e) {
      console.warn("Géométrie foncier illisible pour la ligne", donnees.id[i], e);
      continue;
    }
    features.push({
      type: "Feature",
      geometry,
      properties: {
        final: donnees.final ? donnees.final[i] : null,
        nom_com: donnees.nom_com ? donnees.nom_com[i] : null,
        surf_m2: donnees.surf_m2 ? donnees.surf_m2[i] : null,
      }
    });
  }
  console.info(`Foncier : ${features.length} secteur(s) '${VALEUR_FONCIER_AFFICHEE}' sur ${nbLignes} ligne(s). Valeurs de '${cle}' :`, [...valeursVues]);
  const diagnostic = features.length ? "" : `aucune ligne '${VALEUR_FONCIER_AFFICHEE}' dans '${cle}' (${[...valeursVues].slice(0, 4).join(", ")})`;
  return { type: "FeatureCollection", features, diagnostic };
}

// ============================================================
// Prospects : lecture de la table Prospects_PB_2026 → points GeoJSON
// ============================================================
function trouverColonne(donnees, candidats) {
  const cles = Object.keys(donnees);
  for (const c of candidats) {
    const k = cles.find(cle => cle.toLowerCase() === c.toLowerCase());
    if (k) return k;
  }
  return null;
}

async function chargerProspects() {
  const donnees = await grist.docApi.fetchTable(TABLE_PROSPECTS);
  const cLat = trouverColonne(donnees, CANDIDATS_PROSPECTS.lat);
  const cLon = trouverColonne(donnees, CANDIDATS_PROSPECTS.lon);
  if (!cLat || !cLon) {
    console.warn(`Prospects : colonnes latitude/longitude introuvables dans ${TABLE_PROSPECTS}. Colonnes disponibles :`, Object.keys(donnees));
    return;
  }
  const cTitre   = trouverColonne(donnees, CANDIDATS_PROSPECTS.titre);
  const cAdresse = trouverColonne(donnees, CANDIDATS_PROSPECTS.adresse);
  const cCommune = trouverColonne(donnees, CANDIDATS_PROSPECTS.commune);
  const cStatut  = trouverColonne(donnees, CANDIDATS_PROSPECTS.statut);

  const features = [];
  const nb = (donnees.id || []).length;
  for (let i = 0; i < nb; i++) {
    const lat = parseFloat(String(donnees[cLat][i]).replace(",", "."));
    const lon = parseFloat(String(donnees[cLon][i]).replace(",", "."));
    if (!lat || !lon || isNaN(lat) || isNaN(lon)) continue;
    const titre   = (cTitre   && donnees[cTitre][i])   || "Prospect";
    const adresse = (cAdresse && cAdresse !== cTitre && donnees[cAdresse][i]) || "";
    const commune = (cCommune && donnees[cCommune][i]) || "";
    const statut  = (cStatut  && donnees[cStatut][i])  || "";
    features.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [lon, lat] },
      properties: {
        popupHtml: `<b>${titre}</b>`
          + (adresse ? `<br>${adresse}` : "")
          + (commune ? `<br><span class="popup-commune">${commune}</span>` : "")
          + (statut  ? `<br>${statut}` : "")
      }
    });
  }
  map.getSource("prospects").setData({ type: "FeatureCollection", features });
  console.info(`Prospects : ${features.length} point(s) affiché(s) sur ${nb} ligne(s).`);
}

async function initCarte() {
  map = new maplibregl.Map({
    container: "map",
    style: STYLE_FOND_ORTHO,
    center: CENTRE_DEFAUT,
    zoom: ZOOM_DEFAUT,
    attributionControl: false
  });
  map.addControl(new maplibregl.AttributionControl({
    customAttribution: "© IGN — Orthophotographies"
  }));

  await new Promise(resolve => map.on("load", resolve));

  // --- Foncier repéré (table Grist "Foncier_repere", paresseux) ---
  declarerCalqueParesseux("foncier", async () => {
    const donnees = await grist.docApi.fetchTable(TABLE_FONCIER);
    const geojson = construireGeoJSONFoncier(donnees);

    const note = document.getElementById("foncier-note");
    if (note) note.textContent = geojson.diagnostic ? "⚠ " + geojson.diagnostic : "";

    await enregistrerImagesHachures();
    map.addSource("foncier", { type: "geojson", data: geojson });

    map.addLayer({
      id: "foncier-remplissage",
      type: "fill",
      source: "foncier",
      paint: { "fill-color": COULEUR_FONCIER, "fill-opacity": 0.15 },
      layout: { visibility: "none" }
    }, "prospects-cercles"); // inséré sous les marqueurs
    map.addLayer({
      id: "foncier-hachure",
      type: "fill",
      source: "foncier",
      paint: { "fill-pattern": "hachure-enjeux", "fill-opacity": 1 },
      layout: { visibility: "none" }
    }, "prospects-cercles"); // inséré sous les marqueurs
    map.addLayer({
      id: "foncier-contour",
      type: "line",
      source: "foncier",
      paint: { "line-color": COULEUR_FONCIER, "line-width": 1.5 },
      layout: { visibility: "none" }
    }, "prospects-cercles"); // inséré sous les marqueurs

    // Ordre final (bas → haut) : foncier (couleur, hachures, contour) < prospects < OP.

    map.on("click", "foncier-remplissage", e => {
      const p = e.features[0].properties;
      const commune = p.nom_com || "";
      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`<b>${p.final || "Secteur à enjeux"}</b><br>${commune}${p.surf_m2 ? "<br>Surface : "+Math.round(p.surf_m2).toLocaleString("fr-FR")+" m²" : ""}`)
        .addTo(map);
    });
    map.on("mouseenter", "foncier-remplissage", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "foncier-remplissage", () => { map.getCanvas().style.cursor = ""; });
  });

  // --- Marqueurs OP (source GeoJSON reconstruite à chaque mise à jour Grist) ---
  map.addSource("op", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "op-cercles",
    type: "circle",
    source: "op",
    paint: {
      "circle-radius":        ["case", ["get", "selectionne"], 9, 6],
      "circle-color":         ["case", ["get", "selectionne"], ["get", "couleurIntense"], ["get", "couleurNormal"]],
      "circle-opacity":       ["case", ["get", "selectionne"], 0.85, 0.55],
      "circle-stroke-color":  ["case", ["get", "selectionne"], ["get", "contourIntense"], ["get", "contourNormal"]],
      "circle-stroke-width":  ["case", ["get", "selectionne"], 2, 1.5],
      "circle-stroke-opacity":["case", ["get", "selectionne"], 1, 0.75]
    }
  });

  map.on("click", "op-cercles", e => {
    const f = e.features[0];
    const rowId = f.properties.rowId;
    appliquerSelectionVisuelle(rowId);
    ouvrirPopup(rowId, f.geometry.coordinates, f.properties.popupHtml);
    grist.setCursorPos({ rowId });
  });
  map.on("mouseenter", "op-cercles", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "op-cercles", () => { map.getCanvas().style.cursor = ""; });

  // --- Prospects (table Prospects_PB_2026) : petits points rouges ---
  map.addSource("prospects", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "prospects-cercles",
    type: "circle",
    source: "prospects",
    paint: {
      "circle-radius": RAYON_PROSPECTS,
      "circle-color": COULEUR_PROSPECTS,
      "circle-opacity": 0.85,
      "circle-stroke-color": "#ffffff",
      "circle-stroke-width": 1
    }
  });
  map.moveLayer("op-cercles"); // les OP restent au-dessus des prospects

  // --- Noms des opérations (étiquettes discrètes, masquées par défaut) ---
  map.addLayer({
    id: "op-noms",
    type: "symbol",
    source: "op",
    minzoom: 12,
    layout: {
      visibility: "none",
      "text-field": ["get", "libelle"],
      "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
      "text-size": 10,
      "text-anchor": "top",
      "text-offset": [0, 0.9],
      "text-max-width": 8,
      "text-padding": 3,
      "text-allow-overlap": false,
      "text-optional": true,
      "symbol-sort-key": ["case", ["get", "selectionne"], 0, 1]
    },
    paint: {
      "text-color": "#1b1b1b",
      "text-halo-color": "rgba(255,255,255,0.95)",
      "text-halo-width": 1.5
    }
  });

  map.on("click", "prospects-cercles", e => {
    const f = e.features[0];
    if (popupOuvert) popupOuvert.remove();
    popupOuvert = new maplibregl.Popup({ className: "popup-compact", closeButton: false, maxWidth: "220px" }).setLngLat(f.geometry.coordinates).setHTML(f.properties.popupHtml).addTo(map);
  });
  map.on("mouseenter", "prospects-cercles", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "prospects-cercles", () => { map.getCanvas().style.cursor = ""; });

  chargerProspects().catch(err => console.warn(`Prospects : lecture de ${TABLE_PROSPECTS} impossible (non bloquant) :`, err));

  // --- Contrôle foncier / prospects + légende (haut droit) ---
  const swatchOP = statut => {
    const c = COULEURS_STATUT_OP[statut];
    return `<span class="legende-swatch" style="background:${c.normal};border-color:${c.contourNormal};border-radius:50%"></span>`;
  };
  class ControleFoncier {
    onAdd(mapInstance) {
      this._map = mapInstance;
      this._div = document.createElement("div");
      this._div.className = "maplibregl-ctrl controle-cadastre";
      this._div.innerHTML = `
        <label><input type="checkbox" id="toggle-foncier"> Foncier repéré</label>
        <div class="legende-item" style="margin-left:20px"><span class="legende-swatch" style="background-color:rgba(46,204,64,0.15);background-image:url('${creerDataUriHachure(HACHURE_ENJEUX.tuile, HACHURE_ENJEUX.epaisseur, COULEUR_FONCIER)}');background-repeat:repeat;background-size:${HACHURE_ENJEUX.tuile}px ${HACHURE_ENJEUX.tuile}px;border-color:${COULEUR_FONCIER}"></span>Secteurs à enjeux repérés</div>
        <div id="foncier-note" style="margin-left:20px;max-width:220px;font-size:10px;color:#c01c28;white-space:normal"></div>
        <label><input type="checkbox" id="toggle-prospects" checked> <span class="legende-swatch" style="background:${COULEUR_PROSPECTS};border-radius:50%;width:9px;height:9px"></span> Prospects 2026</label>
        <div class="groupe-titre">Opérations</div>
        <div class="legende-item">${swatchOP("AGREE")}Agréée</div>
        <div class="legende-item">${swatchOP("PREVI")}Prévisionnelle 2026/28</div>
        <label><input type="checkbox" id="toggle-noms"> Noms des opérations</label>
      `;
      return this._div;
    }
    onRemove() { this._div.remove(); this._map = undefined; }
  }
  map.addControl(new ControleFoncier(), "top-right");

  document.getElementById("toggle-prospects").addEventListener("change", e => {
    map.setLayoutProperty("prospects-cercles", "visibility", e.target.checked ? "visible" : "none");
  });

  document.getElementById("toggle-noms").addEventListener("change", e => {
    map.setLayoutProperty("op-noms", "visibility", e.target.checked ? "visible" : "none");
  });

  document.getElementById("toggle-foncier").addEventListener("change", async e => {
    const checkbox = e.target;
    const idsCalque = ["foncier-remplissage", "foncier-hachure", "foncier-contour"];
    if (checkbox.checked) {
      checkbox.disabled = true;
      await activerCalqueParesseux("foncier");
      checkbox.disabled = false;
      if (checkbox.checked && calquesParesseux.foncier.charge) {
        idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "visible"));
      }
    } else if (calquesParesseux.foncier.charge) {
      idsCalque.forEach(id => map.setLayoutProperty(id, "visibility", "none"));
    }
  });
}

function assurerCarte() {
  if (!cartePromise) cartePromise = initCarte();
  return cartePromise;
}

function construirePopupHtml(r) {
  const titre   = r[COL_TITRE]   || "Opération";
  const adresse = r[COL_ADRESSE] || "";
  const commune = r[COL_COMMUNE] || "";
  const statut  = r[COL_STATUT]  || "";
  return `<b>${titre}</b>`
    + (adresse ? `<br>${adresse}` : "")
    + (commune ? `<br><span class="popup-commune">${commune}</span>` : "")
    + (statut  ? `<br>${statut}` : "");
}

function ouvrirPopup(rowId, coordonnees, html) {
  if (popupOuvert) popupOuvert.remove();
  popupOuvert = new maplibregl.Popup().setLngLat(coordonnees).setHTML(html).addTo(map);
}

function construireGeoJSON(records) {
  const features = [];
  let featureSelectionnee = null;

  records.forEach(r => {
    const lat = parseFloat(r[COL_LAT]);
    const lon = parseFloat(r[COL_LON]);
    if (!lat || !lon || isNaN(lat) || isNaN(lon)) return;

    const estSelectionne = (r.id === rowIdSelectionne);
    const couleurs = couleursPourStatut(r[COL_STATUT]);

    const feature = {
      type: "Feature",
      geometry: { type: "Point", coordinates: [lon, lat] },
      properties: {
        rowId: r.id,
        selectionne: estSelectionne,
        couleurNormal: couleurs.normal,
        couleurIntense: couleurs.intense,
        contourNormal: couleurs.contourNormal,
        contourIntense: couleurs.contourIntense,
        libelle: r[COL_TITRE] || "",
        popupHtml: construirePopupHtml(r)
      }
    };

    if (estSelectionne) featureSelectionnee = feature;
    else features.push(feature);
  });

  if (featureSelectionnee) features.push(featureSelectionnee);
  return { type: "FeatureCollection", features };
}

function appliquerSelectionVisuelle(rowId) {
  rowIdSelectionne = rowId;
  map.getSource("op").setData(construireGeoJSON(derniersRecords));
}

async function majMarqueurs(records) {
  derniersRecords = records;
  const geojson = construireGeoJSON(records);
  map.getSource("op").setData(geojson);

  if (geojson.features.length > 0 && rowIdSelectionne === null) {
    const bounds = new maplibregl.LngLatBounds();
    geojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
    map.fitBounds(bounds, { padding: 30, maxZoom: 16 });
  }
}

// ============================================================
// Suivi de visite (compteur privé, table Visites)
// ============================================================
async function enregistrerVisite() {
  try {
    const participants = await grist.docApi.fetchTable(TABLE_PARTICIPANTS);
    if (!participants.id || participants.id.length === 0) {
      console.warn("Widget carte OP : aucune ligne Participants pour cet utilisateur — visite non enregistrée.");
      return;
    }
    const email     = participants[COL_PART_EMAIL][0];
    const nom       = participants[COL_PART_NOM][0];
    const organisme = participants[COL_PART_ORGANISME][0];

    const aujourdhui = new Date().toISOString().slice(0, 10);
    const visites = await grist.docApi.fetchTable(TABLE_VISITES);
    const dejaVisiteAujourdhui = (visites[COL_VISITE_EMAIL] || []).some((e, i) => {
      if (e !== email) return false;
      const timestamp = visites[COL_VISITE_DATE][i];
      if (typeof timestamp !== "number") return false;
      return new Date(timestamp * 1000).toISOString().slice(0, 10) === aujourdhui;
    });
    if (dejaVisiteAujourdhui) return;

    const table = grist.getTable(TABLE_VISITES);
    await table.create({
      fields: {
        [COL_VISITE_EMAIL]:     email,
        [COL_VISITE_NOM]:       nom,
        [COL_VISITE_ORGANISME]: organisme,
        [COL_VISITE_DATE]:      Math.floor(Date.now() / 1000),
      },
    });
    console.info("Widget carte OP : visite enregistrée pour", nom || email);
  } catch (e) {
    console.warn("Widget carte OP : enregistrement de la visite échoué (non bloquant) :", e);
  }
}

// ============================================================
// API Grist — avec mappage de colonnes (panneau « Colonnes visibles »)
// ============================================================
grist.ready({
  requiredAccess: "full",
  allowSelectBy: true,
  columns: [
    { name: COL_LAT,     title: "Latitude",  type: "Any" },
    { name: COL_LON,     title: "Longitude", type: "Any" },
    { name: COL_TITRE,   title: "Titre",     type: "Any", optional: true },
    { name: COL_ADRESSE, title: "Adresse",   type: "Any", optional: true },
    { name: COL_COMMUNE, title: "Commune",   type: "Any", optional: true },
    { name: COL_STATUT,  title: "Statut (PREVI / AGREE)", type: "Any", optional: true }
  ]
});

enregistrerVisite();

grist.onRecords(records => {
  const mapped = grist.mapColumnNames(records);
  if (!mapped) return; // colonnes pas encore associées dans Grist
  assurerCarte().then(() => majMarqueurs(mapped));
});

grist.onRecord(record => {
  const mapped = grist.mapColumnNames(record);
  if (!mapped) return;
  assurerCarte().then(() => {
    appliquerSelectionVisuelle(mapped.id);
    const lat = parseFloat(mapped[COL_LAT]);
    const lon = parseFloat(mapped[COL_LON]);
    if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
      map.easeTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 15) });
      ouvrirPopup(mapped.id, [lon, lat], construirePopupHtml(mapped));
    }
  });
});

window.addEventListener("load", () => { assurerCarte(); });
</script>
