<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rapport d'opération</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --paper:#F1ECDD;--card:#E8E0CB;--ink:#2B3430;--soft:#5B6259;--sage:#7C8F6B;--line:#D9CBA8; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  #app{padding:10px 14px 16px;}
  header.fiche{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px;}
  .header-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  header.fiche h1{margin:0;font-size:19px;font-weight:650;}
  .header-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:1;}
  .section-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:4px 0 6px;}
  .bloc-2023{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 14px;font-size:14px;line-height:2;}
  .bloc-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-bottom:12px;}
  .bloc-row .bloc-2023{flex:1 1 320px;}
  .carte-box{flex:1 1 320px;min-height:230px;position:relative;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#eef1f4;}
  #miniMap{position:absolute;inset:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px 8px;}
  .card h2{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);font-weight:600;}
  .chart-box{position:relative;height:220px;}
  .note{font-size:11px;color:var(--soft);margin-top:5px;}
  .note .futur{color:#C05A00;font-size:13px;font-weight:700;}
  .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);}
  .badge.on{background:var(--sage);border-color:var(--sage);color:#fff;}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .tbl th{background:var(--card);text-transform:uppercase;font-size:10px;letter-spacing:.04em;color:var(--soft);padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;width:33%;}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;width:33%;}
  .tbl small{color:var(--soft);}
  #empty{text-align:center;padding:48px 12px;color:var(--soft);font-size:13px;}
  .hidden{display:none!important;}
  .note .warn{color:#B71C1C;font-size:11px;font-weight:600;margin-top:3px;}
  .note .warn{color:#B71C1C;font-size:11px;font-weight:600;margin-top:3px;}
  .donut-box svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<div id="app">
  <header class="fiche" id="header">
    <div class="header-top">
      <h1 id="titre">Sélectionnez une ligne</h1>
      <div class="header-badges" id="headerBadges"></div>
    </div>
  </header>

  <div class="section-label">Opérations recensées depuis 2023</div>
  <div class="bloc-row" id="blocRow">
    <div class="bloc-2023" id="bloc2023"></div>
    <div class="carte-box"><div id="miniMap"></div></div>
  </div>

  <div class="section-label">Opérations vivantes</div>
  <div class="grid" id="grid">
    <section class="card">
      <h2 id="titreIndicateurs">Nombre de logements dans les opérations en cours</h2>
      <div class="chart-box"><canvas id="chartIndicateurs"></canvas></div>
      <div class="note" id="noteIndicateurs"></div>
    </section>
    <section class="card">
      <h2 id="titreOps">État des opérations en cours</h2>
      <div class="donut-box"><svg id="svgBlocage" viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="note" id="noteBlocage"></div>
    </section>
    <section class="card">
      <h2 id="titreLogs">État des logements en cours</h2>
      <div class="donut-box"><svg id="svgBlocageLogs" viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="note" id="noteBlocageLogs"></div>
    </section>
  </div>

  <div id="tableauAnnees"></div>
  <div id="empty" class="hidden">Aucune ligne sélectionnée.</div>
</div>
<script>
if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);

/* ============ Mapping des colonnes Grist ============ */
const col=(name,title,type,extra={})=>({name,title,type,optional:true,...extra});
grist.ready({
  columns:[
    col('Libelle',           'Libellé (commune)',                          'Any'),
    col('NbOperations',      'Nb opérations vivantes',                     'Numeric'),
    col('NbOps2023',         'Nb opérations recensées depuis 2023',        'Numeric'),
    col('NbLogs2023',        'Nb logements total (depuis 2023)',           'Numeric'),
    col('NbLS2023',          'Dont LLS (depuis 2023)',                     'Numeric'),
    col('NbAcc2023',         'Dont Acc. (depuis 2023)',                    'Numeric'),
    col('OpsLivrees',        'Dont opérations déjà livrées',               'Numeric'),
    col('LogsLivres',        'Dont logements déjà livrés',                 'Numeric'),
    col('OpsTFLivrees',      'Dont opérations TF livrées',                 'Numeric'),
    col('OpsAbandonnees',    'Dont opérations abandonnées',                'Numeric'),
    col('CarteLats',         'Carte : latitudes des opérations (liste)',   'Any'),
    col('CarteLngs',         'Carte : longitudes des opérations (liste)',  'Any'),
    col('CarteEPCI',         'Carte : EPCI de la commune',                 'Any'),
    col('NbLogsVivants',     'Nb logements en cours (vivants)',            'Numeric'),
    col('LogsTFLivres',      'Dont logements TF livrés',                   'Numeric'),
    col('LLSTFLivres',       'Dont LLS TF livrés',                         'Numeric'),
    col('AccesTFLivres',     'Dont Acc. TF livrés',                        'Numeric'),
    col('FuturBlocage',      'Futur blocage détecté (nb logements)',       'Numeric'),
    col('OpsDebloquees',     'Dont opérations déjà débloquées',                   'Numeric'),
    col('OpsArret',          "Dont opérations à l'arrêt",                         'Numeric'),
    col('OpsRecours',        'Dont opérations bloquées par recours',              'Numeric'),
    col('OpsFeuilleRouteTF', 'Dont opérations bloquées avec feuille de route TF', 'Numeric'),
    col('OpsBloqueesRecours','Dont opérations bloquées + recours',                'Numeric'),
    col('LogsArret',         "Dont logements à l'arrêt",                          'Numeric'),
    col('LogsDebloquees',    'Dont logements déjà débloqués',                     'Numeric'),
    col('LogsRecours',       'Dont logements bloqués par recours',                'Numeric'),
    col('LogsFeuilleRouteTF','Dont logements bloqués avec feuille de route TF',   'Numeric'),
    col('LogsBloqueesRecours','Dont logements bloqués + recours',                 'Numeric'),
    col('Indicateurs',       'Logements : total + 4 colonnes "dont"',     'Numeric',{allowMultiple:true,optional:false}),
    col('StatutsBlocage',    'Statuts blocage – opérations (6 colonnes)',  'Numeric',{allowMultiple:true,optional:false}),
    col('StatutsBlocageLogs','Statuts blocage – logements (6 colonnes)',   'Numeric',{allowMultiple:true,optional:false}),
    col('FondFriche',        'Fond friche (€)',                            'Any'),
    col('TEL',               'TEL (€)',                                    'Any'),
    col('FinHDC',            'Financement hors droit commun collectivités (€)', 'Any'),
    col('FinHDCEtat',        'Financement hors droit commun État (€)',     'Any'),
    col('AnneesLivraison',   'Années livraison (liste)',                   'Any'),
    col('AnneesLancement',   'Années lancement travaux (liste)',           'Any'),
    col('AvancementListe',   'Avancement des opérations (liste)',          'Any'),
    col('LogementsLiv',      'Logements / livraison (liste)',              'Any'),
    col('LogementsLan',      'Logements / lancement (liste)',              'Any'),
    col('VenteLivreLiv',     'Vente libre / livraison (liste)',            'Any'),
    col('VenteLivreLan',     'Vente libre / lancement (liste)',            'Any'),
    col('InterLiv',          'Intermédiaire / livraison (liste)',          'Any'),
    col('InterLan',          'Intermédiaire / lancement (liste)',          'Any'),
    col('LLSLiv',            'LLS / livraison (liste)',                    'Any'),
    col('LLSLan',            'LLS / lancement (liste)',                    'Any'),
    col('AccesLiv',          'Accession / livraison (liste)',              'Any'),
    col('AccesLan',          'Accession / lancement (liste)',              'Any'),
  ],
  requiredAccess:'read table',
});

/* ============ Utilitaires ============ */
const $=id=>document.getElementById(id);
const n=v=>{const x=typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''?parseFloat(v.replace(',','.')):NaN);return isFinite(x)?x:0;};
const toArr=v=>Array.isArray(v)?v:[];
const s=k=>k>1?'s':'';                       // pluriel
const fr=v=>v.toLocaleString('fr-FR');
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prettify=c=>{ try{return decodeURIComponent(String(c||'').replace(/_/g,' '));}catch{return String(c||'').replace(/_/g,' ');} };
const formatEuro=v=>typeof v==='number'?fr(v)+' €':(v||'0 €');
const isTruthy=v=>v===true||(typeof v==='number'&&v!==0)||(typeof v==='string'&&['oui','true','x','1','yes'].includes(v.trim().toLowerCase()));
const toggle=show=>{['grid','header','blocRow'].forEach(id=>$(id).classList.toggle('hidden',!show));$('empty').classList.toggle('hidden',show);};

// Insensible aux accents, à la casse, aux apostrophes typographiques et à la ponctuation
function normalizeLabel(str){
  return String(str||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/['’ʼ]/g,"'")
    .replace(/[«»"]/g,'')
    .replace(/[^a-z0-9']+/g,' ')
    .trim();
}

/* ============ Couleurs & graphiques ============ */
const PBAR='#4C6B7A';
const PPIE=['#7CB342','#AED581','#FB8C00','#E53935','#FFEB3B','#64B5F6','#8C6A8F','#C99A3D'];

const isBloqueLabel=lbl=>{
  const norm=normalizeLabel(lbl);
  return (norm.includes('actuellement')||norm.includes('bloque'))&&!norm.includes('debloque');
};

const charts={};
const destroy=id=>{ if(charts[id]){charts[id].destroy();delete charts[id];} };
const baseOpts=()=>({responsive:true,maintainAspectRatio:false,animation:{duration:250}});

// Libellés d'axe : coupe en 2 lignes au milieu si > 20 caractères
const splitLabel=str=>{
  if(str.length<=20) return str;
  const sp=str.lastIndexOf(' ',Math.floor(str.length/2));
  return sp>0?[str.slice(0,sp),str.slice(sp+1)]:str;
};

/* ============ Mini-carte (marqueurs seulement) ============ */
// Seuls les EPCI dont le nom (normalisé) contient un de ces mots-clés sont colorés par commune
const EPCI_COLORISES=['pays basque'];
const COMMUNE_PALETTE=[
  '#b5534a','#5f8f5a','#d1a23f','#4f6f9f','#8a5f9a','#4f9aa8',
  '#c47a9a','#9aa84f','#3f7f76','#9a7048','#7a3f45','#6f7f8f'
];
const colorForIndex=i=>i<COMMUNE_PALETTE.length?COMMUNE_PALETTE[i]:`hsl(${Math.round((i*137.508)%360)}, 40%, 50%)`;
const communeColors={};
let miniMap=null, miniLayer=null, communesCarte=[], selectedKey='', lastFitKey=null;

const isColore=c=>EPCI_COLORISES.some(kw=>c.epci.includes(kw));

grist.onRecords((records,mappings)=>{
  communesCarte=(records||[]).map(r=>{
    const c=grist.mapColumnNames(r,mappings);
    if(!c) return null;
    const lngs=toArr(c.CarteLngs), pts=[];
    toArr(c.CarteLats).forEach((la,i)=>{
      const lat=parseFloat(la), lng=parseFloat(lngs[i]);
      if(isNaN(lat)||isNaN(lng)||(Math.abs(lat)<0.0001&&Math.abs(lng)<0.0001)) return;
      pts.push([lat,lng]);
    });
    return {key:normalizeLabel(c.Libelle), epci:normalizeLabel(c.CarteEPCI), pts};
  }).filter(Boolean);
  drawMiniMap();
});

function initMiniMap(box){
  miniMap=L.map(box,{zoomControl:true,preferCanvas:true,maxZoom:19,attributionControl:false}).setView([46.6,2.4],6);
  L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile'+
    '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM'+
    '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg',
    {maxZoom:19,maxNativeZoom:19,tileSize:256,updateWhenIdle:true,keepBuffer:1}
  ).addTo(miniMap);
  miniLayer=L.layerGroup().addTo(miniMap);
}

function markerStyle(c,isSel){
  if(isColore(c)&&communeColors[c.key]){
    return {radius:isSel?8:5,color:'#ffffff',weight:2,opacity:0.5,fillColor:communeColors[c.key],fillOpacity:isSel?0.9:0.35};
  }
  return {radius:isSel?8:5,color:isSel?'#c2540c':'#e07b1f',weight:isSel?3:1.5,opacity:0.9,fillColor:'#f5a742',fillOpacity:isSel?0.75:0.3};
}

function drawMiniMap(){
  const box=$('miniMap');
  if(!box||box.offsetWidth===0||typeof L==='undefined') return; // bloc masqué : redessiné à l'affichage
  if(!miniMap) initMiniMap(box);
  miniMap.invalidateSize();
  miniLayer.clearLayers();

  // Attribution stable d'une couleur par commune (EPCI colorisés uniquement)
  const nouvelles=[...new Set(communesCarte.filter(c=>c.pts.length&&c.key&&isColore(c)&&!communeColors[c.key]).map(c=>c.key))].sort();
  let idx=Object.keys(communeColors).length;
  nouvelles.forEach(k=>{communeColors[k]=colorForIndex(idx++);});

  const all=[], sel=[];
  // communes non sélectionnées d'abord, sélectionnée par-dessus
  [false,true].forEach(pass=>{
    communesCarte.forEach(c=>{
      const isSel=!!selectedKey&&c.key===selectedKey;
      if(isSel!==pass) return;
      c.pts.forEach(pt=>{
        L.circleMarker(pt,{...markerStyle(c,isSel),interactive:false}).addTo(miniLayer);
        all.push(pt);
        if(isSel) sel.push(pt);
      });
    });
  });

  const fitKey=selectedKey+'|'+all.length;
  if(fitKey!==lastFitKey){
    lastFitKey=fitKey;
    const b=sel.length?sel:all;
    if(b.length) miniMap.fitBounds(b,{padding:[20,20],maxZoom:13});
  }
}

/* ============ Rendu de la ligne sélectionnée ============ */
grist.onRecord((record,mappings)=>{
  const m=grist.mapColumnNames(record);
  if(!m){toggle(false);return;}
  toggle(true);
  $('titre').textContent=m.Libelle||'Opération';

  const nbOps=n(m.NbOperations), nbLogsViv=n(m.NbLogsVivants);
  const opsDeb=n(m.OpsDebloquees), opsArret=n(m.OpsArret);
  const logsDeb=n(m.LogsDebloquees), logsArret=n(m.LogsArret);

  $('titreIndicateurs').innerHTML=`Nombre de logements dans les <strong>${nbOps}</strong> opération${s(nbOps)} en cours`;
  $('titreOps').innerHTML=`État des <strong>${nbOps}</strong> opération${s(nbOps)} en cours`
    +(opsArret>0?` <strong>ET ${opsArret} opération${s(opsArret)} à l'arrêt</strong>`:'')
    +(opsDeb>0?`<br>— <strong>dont</strong> ${opsDeb} opération${s(opsDeb)} déjà débloquée${s(opsDeb)}`:'');
  $('titreLogs').innerHTML=`État des <strong>${fr(nbLogsViv)}</strong> logement${s(nbLogsViv)} en cours`
    +(logsArret>0?` <strong>ET ${logsArret} logement${s(logsArret)} à l'arrêt</strong>`:'')
    +(logsDeb>0?`<br>— <strong>dont</strong> ${logsDeb} logement${s(logsDeb)} déjà débloqué${s(logsDeb)}`:'');

  $('headerBadges').innerHTML=[
    {label:'Fond friche',val:m.FondFriche},
    {label:'TEL',val:m.TEL},
    {label:'Financement hors droit commun collectivités',val:m.FinHDC},
    {label:'Financement hors droit commun État',val:m.FinHDCEtat},
  ].map(i=>`<span class="badge ${isTruthy(i.val)?'on':''}">${i.label} : ${formatEuro(i.val)}</span>`).join('');

  renderBloc2023(m);
  renderIndicateurs(m,mappings);
  renderStatuts({
    m,mappings,key:'StatutsBlocage',svgId:'svgBlocage',noteId:'noteBlocage',centre:['OPÉRATIONS','EN COURS'],
    emptyMsg:'Mappez vos colonnes de blocage opérations.',feminin:true,
    recours:n(m.OpsRecours),tf:n(m.OpsFeuilleRouteTF),both:n(m.OpsBloqueesRecours),futur:n(m.FuturBlocage),
  });
  renderStatuts({
    m,mappings,key:'StatutsBlocageLogs',svgId:'svgBlocageLogs',noteId:'noteBlocageLogs',centre:['LOGEMENTS','EN COURS'],
    emptyMsg:'Mappez vos colonnes de blocage logements.',feminin:false,
    recours:n(m.LogsRecours),tf:n(m.LogsFeuilleRouteTF),both:n(m.LogsBloqueesRecours),futur:0,
  });
  renderTableauAnnees(m);

  selectedKey=normalizeLabel(m.Libelle);
  drawMiniMap();
});

function renderBloc2023(m){
  const ops=n(m.NbOps2023), logs=n(m.NbLogs2023), ls=n(m.NbLS2023), acc=n(m.NbAcc2023);
  const liv=n(m.OpsLivrees), livLogs=n(m.LogsLivres);
  const tf=n(m.OpsTFLivrees), tfLogs=n(m.LogsTFLivres), tfLLS=n(m.LLSTFLivres), tfAcc=n(m.AccesTFLivres);
  const ab=n(m.OpsAbandonnees);
  $('bloc2023').innerHTML=
    `<strong>${ops} opération${s(ops)}</strong> — soit <strong>${fr(logs)} logement${s(logs)}</strong>
     <strong>(dont ${fr(ls)} LLS ; ${fr(acc)} Acc.)</strong><br>
     — dont ${liv} déjà livrée${s(liv)} (${fr(livLogs)} logement${s(livLogs)})<br>
     — dont ${tf} débloquée${s(tf)} par la Task Force et livrée${s(tf)} — soit ${fr(tfLogs)} logement${s(tfLogs)} (${tfLLS} LLS ; ${tfAcc} Acc.)<br>
     — dont ${ab} abandonnée${s(ab)}`;
}

function renderIndicateurs(m,mappings){
  const note=$('noteIndicateurs'), vals=toArr(m.Indicateurs), ids=toArr(mappings&&mappings.Indicateurs);
  destroy('indicateurs');
  if(!vals.length){note.textContent='Mappez vos colonnes logements.';return;}
  note.textContent='';
  const labels=(ids.length===vals.length?ids.map(prettify):vals.map((_,i)=>'Ind.'+(i+1))).map(splitLabel);
  charts.indicateurs=new Chart($('chartIndicateurs'),{
    type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:PBAR,borderRadius:3}]},
    options:{...baseOpts(),plugins:{legend:{display:false},datalabels:{display:false}},
      scales:{x:{ticks:{maxRotation:0,minRotation:0,autoSkip:false},grid:{drawTicks:true,tickLength:8,tickColor:'#5B6259'}},y:{beginAtZero:true}}},
  });
}

/* ============ Donut SVG (même design que donut-logements-widget) ============ */
const DC={nombre:'#1F3864',nom:'#3F5273',sub:'#8497B0',ligne:'#9AA9BE'};
const DCOL={rouge:'#FF0000',orange:'#EF6C00',normal:'#A8D5A2',debloque:'#27AE60',arret:'#000000',abandon:'#C9D1D9'};
function colorFor(lbl,i){
  const nm=normalizeLabel(lbl);
  if(nm.includes('debloque')) return DCOL.debloque;
  if(isBloqueLabel(lbl)) return DCOL.rouge;
  if(nm.includes('normal')) return DCOL.normal;
  if(nm.includes('arret')) return DCOL.arret;
  if(nm.includes('abandon')) return DCOL.abandon;
  return PPIE[i%PPIE.length];
}
const cap=str=>str?str.charAt(0).toUpperCase()+str.slice(1):str;
const f1=x=>x.toFixed(1);
function wrapText(text,max){
  const out=[]; let cur='';
  String(text).split(' ').forEach(w=>{
    if(cur&&(cur+' '+w).length>max){out.push(cur);cur=w;} else cur=cur?cur+' '+w:w;
  });
  if(cur) out.push(cur);
  return out;
}

// segs : [{val,label,color,hatch?}] — centre : [ligne1, ligne2] sous le total
function drawDonut(svgId,segs,total,centre){
  const el=$(svgId);
  const W=520,CX=260,R1=84,R0=52;
  const START=-Math.PI/2,TAU=Math.PI*2,TOP_FROM=TAU*320/360;
  const somme=segs.reduce((t_,x)=>t_+x.val,0);
  if(somme<=0){el.innerHTML='';return;}

  let a=START;
  segs.forEach(x=>{x.a0=a;x.a1=a+x.val/somme*TAU;x.am=(x.a0+x.a1)/2;a=x.a1;});

  const vis=segs.filter(x=>x.val>0);
  vis.forEach(x=>{
    x.top=((x.am-START)%TAU+TAU)%TAU>=TOP_FROM;   // parts proches de 12 h : étiquettes en haut
    x.right=x.top||Math.cos(x.am)>=0;
    x.nameLines=wrapText(x.label,20);
    x.h=23+14*x.nameLines.length;
  });
  const pile=g=>g.reduce((t_,x)=>t_+x.h,0)+Math.max(0,g.length-1)*5+16;
  const hautG=vis.filter(x=>x.top);
  const CY=Math.max(R1+24,hautG.length?R1+8+pile(hautG):0);
  const H=Math.max(CY+R1+24,pile(vis.filter(x=>x.right&&!x.top)),pile(vis.filter(x=>!x.right)));
  el.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const pt=(r,ang)=>[CX+r*Math.cos(ang),CY+r*Math.sin(ang)];
  const sector=(r0,r1,a0,a1)=>{
    if(a1-a0>=TAU) a1=a0+TAU-0.0001;
    const big=a1-a0>Math.PI?1:0;
    const [x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);
    return `M${f1(x0)} ${f1(y0)}A${r1} ${r1} 0 ${big} 1 ${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}A${r0} ${r0} 0 ${big} 0 ${f1(x3)} ${f1(y3)}Z`;
  };

  const hid='h_'+svgId;
  let svg=`<defs><pattern id="${hid}" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)">
    <rect width="9" height="9" fill="${DCOL.rouge}"/><rect width="3.5" height="9" fill="${DCOL.orange}"/></pattern></defs>`;

  vis.forEach(x=>{
    svg+=`<path d="${sector(R0,R1,x.a0,x.a1)}" fill="${x.hatch?`url(#${hid})`:x.color}" stroke="#fff" stroke-width="2"/>`;
  });

  // Centre
  const tot=fr(total), fs=tot.length<=3?30:tot.length<=4?26:tot.length<=5?22:18;
  svg+=`<text x="${CX}" y="${CY+fs*0.12}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${DC.nombre}">${esc(tot)}</text>`
      +`<text x="${CX}" y="${CY+fs*0.12+16}" text-anchor="middle" font-size="10" letter-spacing="2" fill="${DC.sub}">${esc(centre[0])}</text>`
      +`<text x="${CX}" y="${CY+fs*0.12+29}" text-anchor="middle" font-size="10" letter-spacing="2" fill="${DC.sub}">${esc(centre[1])}</text>`;

  // Étiquettes avec traits de repère
  vis.forEach(x=>{ x.y=CY+Math.sin(x.am)*(R1+20); });
  [true,false].forEach(side=>{
    const g=vis.filter(x=>x.right===side&&!x.top).sort((p_,q_)=>p_.y-q_.y);
    if(!g.length) return;
    g[0].y=Math.max(g[0].y,g[0].h/2+4);
    for(let i=1;i<g.length;i++) g[i].y=Math.max(g[i].y,g[i-1].y+(g[i-1].h+g[i].h)/2+5);
    const last=g[g.length-1];
    if(last.y+last.h/2>H-6){
      last.y=H-6-last.h/2;
      for(let i=g.length-2;i>=0;i--) g[i].y=Math.min(g[i].y,g[i+1].y-(g[i].h+g[i+1].h)/2-5);
    }
  });
  // Groupe du haut : empilé au-dessus du donut, la part la plus à gauche en haut (pas de croisement)
  let yb=CY-R1-10;
  vis.filter(x=>x.top).sort((p_,q_)=>q_.am-p_.am).forEach(x=>{ x.y=yb-x.h/2; yb-=x.h+5; });

  vis.forEach(x=>{
    const dir=x.right?1:-1;
    const [x0,y0]=pt(R1+2,x.am);
    const ex=CX+dir*(R1+22), lx=CX+dir*(R1+34);
    const pts=x.top?`${f1(x0)},${f1(y0)} ${f1(x0)},${f1(x.y)} ${f1(lx-4)},${f1(x.y)}`
                   :`${f1(x0)},${f1(y0)} ${f1(ex)},${f1(x.y)} ${f1(lx-dir*4)},${f1(x.y)}`;
    svg+=`<polyline points="${pts}" fill="none" stroke="${DC.ligne}" stroke-width="1"/>`;
    const anchor=x.right?'start':'end';
    let ty=x.y-x.h/2+17;
    svg+=`<text x="${f1(lx)}" y="${f1(ty)}" text-anchor="${anchor}" font-size="19" font-weight="800" fill="${DC.nombre}">${esc(fr(x.val))}</text>`;
    x.nameLines.forEach(line=>{ ty+=14; svg+=`<text x="${f1(lx)}" y="${f1(ty)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="${DC.nom}">${esc(line)}</text>`; });
  });
  el.innerHTML=svg;
}

// Statuts : la part « bloquées » est découpée en tranches qui s'excluent
//   recours seul = recours − cumul ; feuille de route TF seule = tf − cumul ; cumul (hachuré)
function renderStatuts({m,mappings,key,svgId,noteId,emptyMsg,feminin,recours,tf,both,futur,centre}){
  const note=$(noteId), vals=toArr(m[key]), ids=toArr(mappings&&mappings[key]);
  if(!vals.length){note.textContent=emptyMsg;$(svgId).innerHTML='';return;}

  const futurHtml=futur>0?`<div class="futur">${futur} futur blocage${s(futur)} détecté${s(futur)}</div>`:'';
  const labels0=ids.length===vals.length?ids.map(prettify):vals.map((_,i)=>'Statut '+(i+1));

  const bi=labels0.findIndex(isBloqueLabel);
  const B=bi>=0?n(vals[bi]):0;
  const soloR=recours-both, soloT=tf-both, sum=soloR+soloT+both;
  const canSplit=bi>=0&&soloR>=0&&soloT>=0&&sum>0&&sum<=B;
  const bloq=k=>`bloqué${feminin?'e':''}${s(k)}`;

  let warn='';
  if(bi>=0&&B>0&&!canSplit){
    warn=(recours===0&&tf===0&&both===0)
      ?'Détail recours / feuille de route non renseigné (colonnes non mappées ou à 0).'
      :`Colonnes incohérentes : recours ${recours} + feuille de route ${tf} − cumul ${both} = ${sum}, pour ${B} ${bloq(B)}.`;
  }
  note.innerHTML=futurHtml+(warn?`<div class="warn">⚠ ${esc(warn)}</div>`:'');

  const segs=[];
  labels0.forEach((lbl,i)=>{
    if(!(canSplit&&i===bi)){ segs.push({val:n(vals[i]),label:cap(lbl),color:colorFor(lbl,i)}); return; }
    [
      {v:soloR, l:`${bloq(soloR)} par recours seul`,                 color:DCOL.rouge},
      {v:soloT, l:`${bloq(soloT)} avec feuille de route TF seule`,   color:DCOL.orange},
      {v:both,  l:`${bloq(both)} par recours + feuille de route TF`, hatch:true},
      {v:B-sum, l:`autres ${bloq(B-sum)}`,                           color:DCOL.rouge},
    ].filter(x=>x.v>0).forEach(x=>segs.push({val:x.v,label:cap(x.l),color:x.color,hatch:x.hatch}));
  });
  drawDonut(svgId,segs,segs.reduce((t_,x)=>t_+x.val,0),centre);
}

function renderTableauAnnees(m){
  const el=$('tableauAnnees');
  // AvancementListe est dans le même ordre que les autres listes (index i = même opération).
  // On ne filtre donc PAS côté Grist (les index se décaleraient) : l'exclusion des
  // avancements 6/7/8 se fait ici, index par index.
  const avancements=toArr(m.AvancementListe);
  const estExclu=i=>/^[678](\.|$)/.test(String(avancements[i]==null?'':avancements[i]).trim());

  function build(years,logs,vl,inter,lls,acces){
    const d={}, L_=toArr(logs), V=toArr(vl), I=toArr(inter), S=toArr(lls), A=toArr(acces);
    toArr(years).forEach((yr,i)=>{
      if(yr==null||yr===''||estExclu(i)) return;
      const k=String(yr);
      const o=d[k]||(d[k]={ops:0,log:0,vl:0,inter:0,lls:0,acces:0});
      o.ops++; o.log+=n(L_[i]); o.vl+=n(V[i]); o.inter+=n(I[i]); o.lls+=n(S[i]); o.acces+=n(A[i]);
    });
    return d;
  }
  const lan=build(m.AnneesLancement,m.LogementsLan,m.VenteLivreLan,m.InterLan,m.LLSLan,m.AccesLan);
  const liv=build(m.AnneesLivraison,m.LogementsLiv,m.VenteLivreLiv,m.InterLiv,m.LLSLiv,m.AccesLiv);
  const years=[...new Set([...Object.keys(lan),...Object.keys(liv)])].sort();
  if(!years.length){el.innerHTML='';return;}

  const cell=d=>{
    if(!d) return '—';
    const det=[d.vl&&`${d.vl} VL`,d.inter&&`${d.inter} Int.`,d.lls&&`${d.lls} LLS`,d.acces&&`${d.acces} Acc.`].filter(Boolean).join('; ');
    return `${d.ops} op. / ${d.log} log.`+(det?`<br><small>(dont ${det})</small>`:'');
  };
  el.innerHTML=`<table class="tbl"><thead><tr><th>Année</th><th>Lancement travaux</th><th>Livraison</th></tr></thead><tbody>`
    +years.map(y=>`<tr><td>${y}</td><td>${cell(lan[y])}</td><td>${cell(liv[y])}</td></tr>`).join('')
    +`</tbody></table>`;
}
