<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rapport d'opération</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --paper:#F1ECDD; --card:#E8E0CB; --ink:#2B3430;
    --ink-soft:#5B6259; --sage:#7C8F6B; --line:#D9CBA8;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; }
  #app { padding:10px 14px 16px; min-height:100vh; }

  /* HEADER compact */
  header.fiche {
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:12px; gap:12px;
  }
  header.fiche h1 { margin:0; font-size:19px; font-weight:650; }
  .maj-badge { font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); white-space:nowrap; }

  /* GRAPHIQUES */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:3px; padding:10px 12px 8px; }
  .card h2 { margin:0 0 8px; font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600; }
  .card .chart-box { position:relative; height:220px; }
  .card .note { font-size:11px; color:var(--ink-soft); margin-top:6px; }

  /* SUBVENTIONS */
  .subventions {
    display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;
  }
  .badge { font-size:11px; font-weight:600; padding:3px 10px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); }
  .badge.on { background:var(--sage); border-color:var(--sage); color:#fff; }

  /* TABLEAU ANNÉES */
  .tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  .tbl th { background:var(--card); text-transform:uppercase; font-size:10px;
    letter-spacing:.04em; color:var(--ink-soft); padding:4px 8px;
    border-bottom:1px solid var(--line); text-align:center; width:33%; }
  .tbl td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:center; width:33%; }

  #empty { text-align:center; padding:48px 12px; color:var(--ink-soft); font-size:13px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">

  <header class="fiche" id="header">
    <h1 id="titre">Sélectionnez une ligne</h1>
    <span class="maj-badge mono" id="majLine">Mise à jour —</span>
  </header>

  <div class="grid" id="grid">
    <section class="card">
      <h2>Nombre de logements dans les opérations</h2>
      <div class="chart-box"><canvas id="chartIndicateurs"></canvas></div>
      <div class="note" id="noteIndicateurs"></div>
    </section>

    <section class="card">
      <h2>L'état de blocage des opérations en cours — <span id="nbOpsLabel" style="font-weight:400;"></span></h2>
      <div class="chart-box"><canvas id="chartBlocage"></canvas></div>
      <div class="note" id="noteBlocage"></div>
    </section>
  </div>

  <!-- SUBVENTIONS horizontales -->
  <div class="subventions" id="badges"></div>

  <!-- TABLEAU ANNÉES -->
  <div id="tableauAnnees"></div>

  <div id="empty" class="hidden">
    Aucune ligne sélectionnée.
  </div>

</div>
<script>
if (window.ChartDataLabels) { Chart.register(window.ChartDataLabels); }

grist.ready({
  columns: [
    { name:'Libelle',          title:'Libellé (commune)',                              type:'Text',    optional:true },
    { name:'DerniereMaJ',      title:'Date dernière mise à jour',                      type:'DateTime',optional:true },
    { name:'NbOperations',     title:"Nombre d'opérations concernées",                 type:'Numeric', optional:true },
    { name:'AnneesLivraison',  title:'Années livraison (liste)',                        type:'Any',     optional:true },
    { name:'AnneesLancement',  title:'Années lancement travaux (liste)',                type:'Any',     optional:true },
    { name:'LogementsLiv',     title:'Logements / livraison (liste)',                   type:'Any',     optional:true },
    { name:'LogementsLan',     title:'Logements / lancement (liste)',                   type:'Any',     optional:true },
    { name:'VenteLivreLiv',    title:'Vente libre / livraison (liste)',                 type:'Any',     optional:true },
    { name:'VenteLivreLan',    title:'Vente libre / lancement (liste)',                 type:'Any',     optional:true },
    { name:'InterLiv',         title:'Intermédiaire / livraison (liste)',               type:'Any',     optional:true },
    { name:'InterLan',         title:'Intermédiaire / lancement (liste)',               type:'Any',     optional:true },
    { name:'LLSLiv',           title:'LLS / livraison (liste)',                         type:'Any',     optional:true },
    { name:'LLSLan',           title:'LLS / lancement (liste)',                         type:'Any',     optional:true },
    { name:'AccesLiv',         title:'Accession / livraison (liste)',                   type:'Any',     optional:true },
    { name:'AccesLan',         title:'Accession / lancement (liste)',                   type:'Any',     optional:true },
    { name:'FondFriche',       title:'Fond friche (€)',                                 type:'Any',     optional:true },
    { name:'AMB',              title:'AMB (€)',                                         type:'Any',     optional:true },
    { name:'TEL',              title:'TEL (€)',                                         type:'Any',     optional:true },
    { name:'FinHDC',           title:'Financements h.d.c. total (€)',                   type:'Any',     optional:true },
    { name:'Indicateurs',      title:'Logements : total + 4 colonnes "dont"',
      type:'Numeric', allowMultiple:true },
    { name:'StatutsBlocage',   title:'Statuts de blocage (6 colonnes)',
      type:'Numeric', allowMultiple:true },
  ],
  requiredAccess:'read table',
});

const PALETTE_BAR = '#4C6B7A';
const PALETTE_PIE = ['#7CB342','#AED581','#FB8C00','#E53935','#FFEB3B','#64B5F6','#8C6A8F','#C99A3D'];
const charts = {};

function destroy(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function prettify(c) {
  try { return decodeURIComponent(String(c||'').replace(/_/g,' ')); }
  catch(e) { return String(c||'').replace(/_/g,' '); }
}

function formatDate(v) {
  if (typeof v==='number') return new Date(v*1000).toLocaleDateString('fr-FR');
  if (v instanceof Date)   return v.toLocaleDateString('fr-FR');
  if (typeof v==='string'&&v.trim()) { const d=new Date(v); return isNaN(d)?v:d.toLocaleDateString('fr-FR'); }
  return '—';
}

function formatEuro(v) {
  if (typeof v==='number') return v.toLocaleString('fr-FR')+' €';
  if (v===true) return 'oui';
  if (!v) return '0 €';
  return v;
}

function isTruthy(v) {
  if (v===true) return true;
  if (typeof v==='number') return v!==0;
  if (typeof v==='string') return ['oui','true','x','1','yes'].includes(v.trim().toLowerCase());
  return false;
}

grist.onRecord((record, mappings) => {
  const m = grist.mapColumnNames(record);
  if (!m) { showEmpty(); return; }
  hideEmpty();
  document.getElementById('majLine').textContent = 'Mise à jour — ' + formatDate(m.DerniereMaJ);
  document.getElementById('titre').textContent   = m.Libelle || 'Opération';
  renderIndicateurs(m, mappings);
  renderBlocage(m, mappings);
  renderNbOps(m);
  renderBadges(m);
  renderTableauAnnees(m);
});

/* ---- Subventions (horizontal) ---- */
function renderBadges(m) {
  const items = [
    { label:'Fond friche',         val:m.FondFriche },
    { label:'AMB',                 val:m.AMB },
    { label:'TEL',                 val:m.TEL },
    { label:'Financements h.d.c.', val:m.FinHDC },
  ];
  document.getElementById('badges').innerHTML = items
    .map(i=>`<span class="badge ${isTruthy(i.val)?'on':''}">${i.label} : ${formatEuro(i.val)}</span>`)
    .join('');
}

/* ---- Compteur opérations ---- */
function renderNbOps(m) {
  const el = document.getElementById('nbOpsLabel');
  const n  = m.NbOperations;
  el.textContent = typeof n==='number'
    ? n.toLocaleString('fr-FR') + ' opération' + (n>1?'s':'') + ' référencée' + (n>1?'s':'')
    : '';
}

/* ---- Tableau années ---- */
function renderTableauAnnees(m) {
  const el = document.getElementById('tableauAnnees');
  function toArr(v) { return Array.isArray(v)?v:[]; }

  function buildData(years, logs, vl, inter, lls, acces) {
    const d = {};
    toArr(years).forEach((yr,i)=>{
      if (yr==null||yr==='') return;
      const k = String(yr);
      if (!d[k]) d[k]={ops:0,log:0,vl:0,inter:0,lls:0,acces:0};
      d[k].ops++;
      d[k].log   += Number(toArr(logs)[i])  ||0;
      d[k].vl    += Number(toArr(vl)[i])    ||0;
      d[k].inter += Number(toArr(inter)[i]) ||0;
      d[k].lls   += Number(toArr(lls)[i])   ||0;
      d[k].acces += Number(toArr(acces)[i]) ||0;
    });
    return d;
  }

  const lan = buildData(m.AnneesLancement, m.LogementsLan, m.VenteLivreLan, m.InterLan, m.LLSLan, m.AccesLan);
  const liv = buildData(m.AnneesLivraison, m.LogementsLiv, m.VenteLivreLiv, m.InterLiv, m.LLSLiv, m.AccesLiv);
  const years = [...new Set([...Object.keys(lan),...Object.keys(liv)])].sort();
  if (!years.length) { el.innerHTML=''; return; }

  function cell(d) {
    if (!d) return '—';
    const detail = [
      d.vl    ? `${d.vl} VL`      : '',
      d.inter ? `${d.inter} Int.` : '',
      d.lls   ? `${d.lls} LLS`   : '',
      d.acces ? `${d.acces} Acc.` : '',
    ].filter(Boolean).join('; ');
    return `${d.ops} op. / ${d.log} log.`
      + (detail ? `<br><small style="color:var(--ink-soft)">(dont ${detail})</small>` : '');
  }

  const rows = years.map(y=>`<tr>
    <td>${y}</td><td>${cell(lan[y])}</td><td>${cell(liv[y])}</td>
  </tr>`).join('');

  el.innerHTML = `<table class="tbl">
    <thead><tr><th>Année</th><th>Lancement travaux</th><th>Livraison</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ---- Graphique 1 — barres (légendes horizontales) ---- */
function renderIndicateurs(m, mappings) {
  const note   = document.getElementById('noteIndicateurs');
  const values = Array.isArray(m.Indicateurs)?m.Indicateurs:[];
  const colIds = Array.isArray(mappings&&mappings.Indicateurs)?mappings.Indicateurs:[];
  if (!values.length) {
    note.textContent='Mappez vos colonnes logements dans "Indicateurs".';
    destroy('indicateurs'); return;
  }
  note.textContent='';

  // Labels : scindés en 2 lignes si > 20 chars
  function splitLabel(s) {
    if (s.length<=20) return s;
    const mid = Math.floor(s.length/2);
    const sp  = s.lastIndexOf(' ', mid);
    return sp>0 ? [s.slice(0,sp), s.slice(sp+1)] : s;
  }
  const rawLabels = colIds.length===values.length ? colIds.map(prettify) : values.map((_,i)=>'Ind.'+(i+1));
  const labels = rawLabels.map(splitLabel);

  destroy('indicateurs');
  charts.indicateurs = new Chart(document.getElementById('chartIndicateurs'),{
    type:'bar',
    data:{ labels, datasets:[{ data:values, backgroundColor:PALETTE_BAR, borderRadius:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:250},
      plugins:{ legend:{display:false}, datalabels:{display:false} },
      scales:{
        x:{
          ticks:{ maxRotation:0, minRotation:0, autoSkip:false },
          grid:{ drawTicks:true, tickLength:8, tickColor:'#5B6259' }
        },
        y:{ beginAtZero:true }
      },
    },
  });
}

/* ---- Graphique 2 — pie blocage ---- */
function renderBlocage(m, mappings) {
  const note   = document.getElementById('noteBlocage');
  const values = Array.isArray(m.StatutsBlocage)?m.StatutsBlocage:[];
  const colIds = Array.isArray(mappings&&mappings.StatutsBlocage)?mappings.StatutsBlocage:[];
  if (!values.length) {
    note.textContent='Mappez vos colonnes de blocage dans "StatutsBlocage".';
    destroy('blocage'); return;
  }
  note.textContent='';
  const labels = colIds.length===values.length?colIds.map(prettify):values.map((_,i)=>'Statut '+(i+1));
  destroy('blocage');
  charts.blocage = new Chart(document.getElementById('chartBlocage'),{
    type:'pie',
    data:{ labels, datasets:[{ data:values, backgroundColor:PALETTE_PIE.slice(0,values.length) }] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:250},
      plugins:{
        legend:{ display:true, position:'right', labels:{ boxWidth:14, font:{size:15}, padding:10 } },
        datalabels:{
          color:'#2B3430',
          font:{ size:15, weight:'700' },
          backgroundColor:'rgba(255,255,255,0.75)',
          borderRadius:4,
          padding:{ top:2, bottom:2, left:4, right:4 },
          formatter:(v)=> (!v||v===0) ? '' : v,
        },
      },
    },
  });
}

function showEmpty() {
  ['grid','header'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('empty').classList.remove('hidden');
}
function hideEmpty() {
  ['grid','header'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  document.getElementById('empty').classList.add('hidden');
}
</script>
</body>
</html>
