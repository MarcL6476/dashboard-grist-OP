<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rapport d'opération</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{ --paper:#F1ECDD;--card:#E8E0CB;--ink:#2B3430;--soft:#5B6259;--sage:#7C8F6B;--line:#D9CBA8; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  #app{padding:10px 14px 16px;}
  header.fiche{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px;}
  .header-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  header.fiche h1{margin:0;font-size:19px;font-weight:650;}
  .maj{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);white-space:nowrap;}
  .header-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:1;}
  .section-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:4px 0 6px;}
  .bloc-2023{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 14px;margin-bottom:12px;font-size:14px;line-height:2;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px 8px;}
  .card h2{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);font-weight:600;}
  .chart-box{position:relative;height:220px;}
  .note{font-size:11px;color:var(--soft);margin-top:5px;}
  .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);}
  .badge.on{background:var(--sage);border-color:var(--sage);color:#fff;}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .tbl th{background:var(--card);text-transform:uppercase;font-size:10px;letter-spacing:.04em;color:var(--soft);padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;width:33%;}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;width:33%;}
  #empty{text-align:center;padding:48px 12px;color:var(--soft);font-size:13px;}
  .hidden{display:none!important;}
  .blocage-detail{margin:2px 0 6px 22px;}
  .blocage-detail .bd-line{color:#C05A00;font-size:11px;font-weight:700;line-height:1.6;}
  .blocage-detail .bd-glyph{display:inline-block;width:14px;font-family:monospace;color:#C05A00;}
  .chart-row{display:flex;gap:0px;align-items:flex-start;}
  .chart-row .chart-box{flex:1 1 50%;height:200px;}
  .custom-legend{flex:1 1 50%;padding-top:6px;font-size:14px;margin-left:-38px;}
  .custom-legend .legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .custom-legend .legend-swatch{width:14px;height:14px;border-radius:3px;flex:none;}
</style>
</head>
<body>
<div id="app">
  <header class="fiche" id="header">
    <div class="header-top">
      <h1 id="titre">Sélectionnez une ligne</h1>
      <div class="header-badges" id="headerBadges"></div>
    </div>
  </header>

  <div class="section-label">Opérations recensées depuis 2023</div>
  <div class="bloc-2023" id="bloc2023"></div>

  <div class="section-label">Opérations vivantes</div>
  <div class="grid" id="grid">
    <section class="card">
      <h2 id="titreIndicateurs">Nombre de logements dans les opérations en cours</h2>
      <div class="chart-box"><canvas id="chartIndicateurs"></canvas></div>
      <div class="note" id="noteIndicateurs"></div>
    </section>
    <section class="card">
      <h2 id="titreOps">État des opérations en cours</h2>
      <div class="chart-row">
        <div class="chart-box"><canvas id="chartBlocage"></canvas></div>
        <div id="legendBlocage" class="custom-legend"></div>
      </div>
      <div class="note" id="noteBlocage"></div>
    </section>
    <section class="card">
      <h2 id="titreLogs">État des logements en cours</h2>
      <div class="chart-row">
        <div class="chart-box"><canvas id="chartBlocageLogs"></canvas></div>
        <div id="legendBlocageLogs" class="custom-legend"></div>
      </div>
      <div class="note" id="noteBlocageLogs"></div>
    </section>
  </div>

  <div id="tableauAnnees"></div>
  <div id="empty" class="hidden">Aucune ligne sélectionnée.</div>
</div>
<script>
if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);

const col=(name,title,type,extra={})=>({name,title,type,optional:true,...extra});
grist.ready({
  columns:[
    col('Libelle',           'Libellé (commune)',                          'Any'),
    col('NbOperations',      'Nb opérations vivantes',                     'Numeric'),
    col('NbOps2023',         'Nb opérations recensées depuis 2023',        'Numeric'),
    col('NbLogs2023',        'Nb logements total (depuis 2023)',           'Numeric'),
    col('NbLS2023',          'Dont LLS (depuis 2023)',                     'Numeric'),
    col('NbAcc2023',         'Dont Acc. (depuis 2023)',                    'Numeric'),
    col('OpsLivrees',        'Dont opérations déjà livrées',               'Numeric'),
    col('LogsLivres',        'Dont logements déjà livrés',                 'Numeric'),
    col('OpsTFLivrees',      'Dont opérations TF livrées',                 'Numeric'),
    col('NbLogsVivants',    'Nb logements en cours (vivants)',            'Numeric'),
    col('LogsTFLivres',     'Dont logements TF livrés',                   'Numeric'),
    col('LLSTFLivres',      'Dont LLS TF livrés',                         'Numeric'),
    col('AccesTFLivres',    'Dont Acc. TF livrés',                        'Numeric'),
    col('FuturBlocage',      'Futur blocage détecté (nb logements)',        'Numeric'),
    col('OpsDebloquees',     'Dont opérations déjà débloquées',                   'Numeric'),
    col('OpsArret',          "Dont opérations à l'arrêt",                         'Numeric'),
    col('OpsRecours',        'Dont opérations bloquées par recours',              'Numeric'),
    col('OpsFeuilleRouteTF', 'Dont opérations bloquées avec feuille de route TF', 'Numeric'),
    col('OpsBloqueesRecours','Dont opérations bloquées + recours',                'Numeric'),
    col('LogsArret',          "Dont logements à l'arrêt",                         'Numeric'),
    col('LogsDebloquees',     'Dont logements déjà débloqués',                    'Numeric'),
    col('LogsRecours',        'Dont logements bloqués par recours',               'Numeric'),
    col('LogsFeuilleRouteTF', 'Dont logements bloqués avec feuille de route TF',  'Numeric'),
    col('LogsBloqueesRecours','Dont logements bloqués + recours',                 'Numeric'),
    col('Indicateurs',       'Logements : total + 4 colonnes "dont"',     'Numeric',{allowMultiple:true,optional:false}),
    col('StatutsBlocage',    'Statuts blocage – opérations (6 colonnes)',  'Numeric',{allowMultiple:true,optional:false}),
    col('StatutsBlocageLogs','Statuts blocage – logements (6 colonnes)',   'Numeric',{allowMultiple:true,optional:false}),
    col('FondFriche',        'Fond friche (€)',                            'Any'),
    col('TEL',               'TEL (€)',                                    'Any'),
    col('FinHDC',            'Financement hors droit commun collectivités (€)', 'Any'),
    col('FinHDCEtat',        'Financement hors droit commun État (€)',     'Any'),
    col('AnneesLivraison',   'Années livraison (liste)',                   'Any'),
    col('AnneesLancement',   'Années lancement travaux (liste)',           'Any'),
    col('LogementsLiv',      'Logements / livraison (liste)',              'Any'),
    col('LogementsLan',      'Logements / lancement (liste)',              'Any'),
    col('VenteLivreLiv',     'Vente libre / livraison (liste)',            'Any'),
    col('VenteLivreLan',     'Vente libre / lancement (liste)',            'Any'),
    col('InterLiv',          'Intermédiaire / livraison (liste)',          'Any'),
    col('InterLan',          'Intermédiaire / lancement (liste)',          'Any'),
    col('LLSLiv',            'LLS / livraison (liste)',                    'Any'),
    col('LLSLan',            'LLS / lancement (liste)',                    'Any'),
    col('AccesLiv',          'Accession / livraison (liste)',              'Any'),
    col('AccesLan',          'Accession / lancement (liste)',              'Any'),
  ],
  requiredAccess:'read table',
});

const PBAR='#4C6B7A';
const PPIE=['#7CB342','#AED581','#FB8C00','#E53935','#FFEB3B','#64B5F6','#8C6A8F','#C99A3D'];

function normalizeLabel(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/['’ʼ]/g,"'")
    .replace(/[«»"]/g,'')
    .replace(/[^a-z0-9']+/g,' ')
    .trim();
}

function isBloqueLabel(lbl){
  const norm=normalizeLabel(lbl);
  return (norm.includes('actuellement')||norm.includes('bloque'))&&!norm.includes('debloque');
}

const STATUS_KEYWORDS=[
  {kw:'feuille',       color:'#FB8C00'},
  {kw:'recours',       color:'#FFEB3B'},
  {kw:'actuellement',  color:'#E53935'},
  {kw:'bloques',  color:'#E53935'},
  {kw:'arret',         color:'#000000'},
  {kw:'normal',        color:'#7CB342'},
];

function resolveColors(labels){
  let fallbackIdx=0;
  return labels.map(lbl=>{
    const norm=normalizeLabel(lbl);
    const hit=STATUS_KEYWORDS.find(({kw})=>norm.includes(kw));
    if(hit) return hit.color;
    const c=PPIE[fallbackIdx%PPIE.length];
    fallbackIdx++;
    return c;
  });
}
const charts={};
const $=id=>document.getElementById(id);
const n=v=>typeof v==='number'?v:0;
const toArr=v=>Array.isArray(v)?v:[];
const destroy=id=>{ if(charts[id]){charts[id].destroy();delete charts[id];} };
const prettify=c=>{ try{return decodeURIComponent(String(c||'').replace(/_/g,' '));}catch{return String(c||'').replace(/_/g,' ');} };
const formatDate=v=>{const d=typeof v==='number'?new Date(v*1000):new Date(v);return(d&&!isNaN(d))?d.toLocaleDateString('fr-FR'):'—';};
const formatEuro=v=>typeof v==='number'?v.toLocaleString('fr-FR')+' €':(v||'0 €');
const isTruthy=v=>v===true||(typeof v==='number'&&v!==0)||(typeof v==='string'&&['oui','true','x','1','yes'].includes(v.trim().toLowerCase()));
const toggle=show=>{['grid','header','bloc2023'].forEach(id=>$(id).classList.toggle('hidden',!show));$('empty').classList.toggle('hidden',show);};
const baseOpts=()=>({responsive:true,maintainAspectRatio:false,animation:{duration:250}});
const pieOpts=()=>({...baseOpts(),plugins:{
  legend:{display:true,position:'right',labels:{boxWidth:14,font:{size:15},padding:10}},
  datalabels:{color:'#2B3430',font:{size:15,weight:'700'},backgroundColor:'rgba(255,255,255,0.75)',
    borderRadius:4,padding:{top:2,bottom:2,left:4,right:4},
    display:ctx=>ctx.dataset.data[ctx.dataIndex]>0,formatter:v=>v},
}});

grist.onRecord((record,mappings)=>{
  const m=grist.mapColumnNames(record);
  if(!m){toggle(false);return;}
  toggle(true);
  $('titre').textContent=m.Libelle||'Opération';

  const nbOps=n(m.NbOperations), nbLogsViv=n(m.NbLogsVivants), opsDeb=n(m.OpsDebloquees), opsArret=n(m.OpsArret);
  $('titreIndicateurs').innerHTML=`Nombre de logements dans les <strong>${nbOps}</strong> opération${nbOps>1?'s':''} en cours`;

  $('titreOps').innerHTML=`État des <strong>${nbOps}</strong> opération${nbOps>1?'s':''} en cours`
    +(opsArret>0?` <strong>ET ${opsArret} opération${opsArret>1?'s':''} à l'arrêt</strong>`:'')
    +(opsDeb>0?`<br>— <strong>dont</strong> ${opsDeb} opération${opsDeb>1?'s':''} déjà débloquée${opsDeb>1?'s':''}`:'');

  const logsArret=n(m.LogsArret), logsDeb=n(m.LogsDebloquees);
  $('titreLogs').innerHTML=`État des <strong>${nbLogsViv.toLocaleString('fr-FR')}</strong> logement${nbLogsViv>1?'s':''} en cours`
    +(logsArret>0?` <strong>ET ${logsArret} logement${logsArret>1?'s':''} à l'arrêt</strong>`:'')
    +(logsDeb>0?`<br>— <strong>dont</strong> ${logsDeb} logement${logsDeb>1?'s':''} déjà débloqué${logsDeb>1?'s':''}`:'');

  $('headerBadges').innerHTML=[
    {label:'Fond friche',val:m.FondFriche},
    {label:'TEL',val:m.TEL},
    {label:'Financement hors droit commun collectivités',val:m.FinHDC},
    {label:'Financement hors droit commun État',val:m.FinHDCEtat},
  ].map(i=>`<span class="badge ${isTruthy(i.val)?'on':''}">${i.label} : ${formatEuro(i.val)}</span>`).join('');

  renderBloc2023(m);
  renderIndicateurs(m,mappings);
  renderBlocage(m,mappings);
  renderBlocageLogs(m,mappings);
  renderTableauAnnees(m);
});

function renderBloc2023(m){
  const ops=n(m.NbOps2023), logs=n(m.NbLogs2023), ls=n(m.NbLS2023), acc=n(m.NbAcc2023);
  const liv=n(m.OpsLivrees), livLogs=n(m.LogsLivres);
  const tf=n(m.OpsTFLivrees), tfLogs=n(m.LogsTFLivres), tfLLS=n(m.LLSTFLivres), tfAcc=n(m.AccesTFLivres);
  $('bloc2023').innerHTML=
    `<strong>${ops} opération${ops>1?'s':''}</strong> — soit <strong>${logs.toLocaleString('fr-FR')} logement${logs>1?'s':''}</strong>
     <strong>(dont ${ls.toLocaleString('fr-FR')} LLS ; ${acc.toLocaleString('fr-FR')} Acc.)</strong><br>
     — dont ${liv} déjà livrée${liv>1?'s':''} (${livLogs.toLocaleString('fr-FR')} logement${livLogs>1?'s':''})<br>
     — dont ${tf} débloquée${tf>1?'s':''} par la Task Force et livrée${tf>1?'s':''} — soit ${tfLogs.toLocaleString('fr-FR')} logement${tfLogs>1?'s':''} (${tfLLS} LLS ; ${tfAcc} Acc.)`;
}

function renderIndicateurs(m,mappings){
  const note=$('noteIndicateurs'), vals=toArr(m.Indicateurs), ids=toArr(mappings&&mappings.Indicateurs);
  if(!vals.length){note.textContent='Mappez vos colonnes logements.';destroy('indicateurs');return;}
  note.textContent='';
  const split=s=>s.length<=20?s:(sp=>sp>0?[s.slice(0,sp),s.slice(sp+1)]:s)(s.lastIndexOf(' ',Math.floor(s.length/2)));
  const labels=(ids.length===vals.length?ids.map(prettify):vals.map((_,i)=>'Ind.'+(i+1))).map(split);
  destroy('indicateurs');
  charts.indicateurs=new Chart($('chartIndicateurs'),{
    type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:PBAR,borderRadius:3}]},
    options:{...baseOpts(),plugins:{legend:{display:false},datalabels:{display:false}},
      scales:{x:{ticks:{maxRotation:0,minRotation:0,autoSkip:false},grid:{drawTicks:true,tickLength:8,tickColor:'#5B6259'}},y:{beginAtZero:true}}},
  });
}

function makePie(canvasId,vals,labels,colors,opts={}){
  destroy(canvasId);
  const backgroundColor=colors||PPIE.slice(0,vals.length);
  const options=pieOpts();
  if(opts.hideLegend) options.plugins.legend.display=false;
  charts[canvasId]=new Chart($(canvasId),{type:'pie',
    data:{labels,datasets:[{data:vals,backgroundColor}]},
    options,
  });
}

function renderBlocage(m,mappings){
  const note=$('noteBlocage'), legendEl=$('legendBlocage'), vals=toArr(m.StatutsBlocage), ids=toArr(mappings&&mappings.StatutsBlocage);
  if(!vals.length){note.textContent='Mappez vos colonnes de blocage opérations.';legendEl.innerHTML='';destroy('chartBlocage');return;}

  const fb=n(m.FuturBlocage);
  note.innerHTML=fb>0?`<div style="color:#C05A00;font-size:13px;font-weight:700;">${fb} futur blocage${fb>1?'s':''} détecté${fb>1?'s':''}</div>`:'';

  const labels=ids.length===vals.length?ids.map(prettify):vals.map((_,i)=>'Statut '+(i+1));
  const colors=resolveColors(labels);

  const recours=n(m.OpsRecours), tf=n(m.OpsFeuilleRouteTF), both=n(m.OpsBloqueesRecours);
  const items=[];
  if(recours>0) items.push(`${recours} bloquée${recours>1?'s':''} par recours`);
  if(tf>0) items.push(`${tf} bloquée${tf>1?'s':''} hors recours`);
  if(both>0) items.push(`(dont ${both} bloquée${both>1?'s':''} + recours)`);
  const detailHtml=items.length?'<div class="blocage-detail">'+items.map((txt,i)=>{
    const glyph=items.length===1?'—':(i===0?'┌':(i===items.length-1?'└':'├'));
    return `<div class="bd-line"><span class="bd-glyph">${glyph}</span>${txt}</div>`;
  }).join('')+'</div>':'';

  legendEl.innerHTML=labels.map((lbl,i)=>{
    return `<div class="legend-item"><span class="legend-swatch" style="background:${colors[i]}"></span>${lbl}</div>`
      +(isBloqueLabel(lbl)?detailHtml:'');
  }).join('');

  makePie('chartBlocage',vals,labels,colors,{hideLegend:true});
}

function renderBlocageLogs(m,mappings){
  const note=$('noteBlocageLogs'), legendEl=$('legendBlocageLogs'), vals=toArr(m.StatutsBlocageLogs), ids=toArr(mappings&&mappings.StatutsBlocageLogs);
  if(!vals.length){note.textContent='Mappez vos colonnes de blocage logements.';legendEl.innerHTML='';destroy('chartBlocageLogs');return;}
  note.textContent='';

  const labels=ids.length===vals.length?ids.map(prettify):vals.map((_,i)=>'Statut '+(i+1));
  const colors=resolveColors(labels);

  const recours=n(m.LogsRecours), tf=n(m.LogsFeuilleRouteTF), both=n(m.LogsBloqueesRecours);
  const items=[];
  if(recours>0) items.push(`${recours} bloqué${recours>1?'s':''} par recours`);
  if(tf>0) items.push(`${tf} bloqué${tf>1?'s':''} hors recours`);
  if(both>0) items.push(`(dont ${both} bloqué${both>1?'s':''} + recours)`);
  const detailHtml=items.length?'<div class="blocage-detail">'+items.map((txt,i)=>{
    const glyph=items.length===1?'—':(i===0?'┌':(i===items.length-1?'└':'├'));
    return `<div class="bd-line"><span class="bd-glyph">${glyph}</span>${txt}</div>`;
  }).join('')+'</div>':'';

  legendEl.innerHTML=labels.map((lbl,i)=>{
    return `<div class="legend-item"><span class="legend-swatch" style="background:${colors[i]}"></span>${lbl}</div>`
      +(isBloqueLabel(lbl)?detailHtml:'');
  }).join('');

  makePie('chartBlocageLogs',vals,labels,colors,{hideLegend:true});
}

function renderTableauAnnees(m){
  const el=$('tableauAnnees');
  function build(years,logs,vl,inter,lls,acces){
    const d={};
    toArr(years).forEach((yr,i)=>{
      if(yr==null||yr==='') return;
      const k=String(yr);
      if(!d[k]) d[k]={ops:0,log:0,vl:0,inter:0,lls:0,acces:0};
      d[k].ops++;
      d[k].log+=n(toArr(logs)[i]); d[k].vl+=n(toArr(vl)[i]);
      d[k].inter+=n(toArr(inter)[i]); d[k].lls+=n(toArr(lls)[i]); d[k].acces+=n(toArr(acces)[i]);
    });
    return d;
  }
  const lan=build(m.AnneesLancement,m.LogementsLan,m.VenteLivreLan,m.InterLan,m.LLSLan,m.AccesLan);
  const liv=build(m.AnneesLivraison,m.LogementsLiv,m.VenteLivreLiv,m.InterLiv,m.LLSLiv,m.AccesLiv);
  const years=[...new Set([...Object.keys(lan),...Object.keys(liv)])].sort();
  if(!years.length){el.innerHTML='';return;}
  const cell=d=>{
    if(!d) return '—';
    const det=[d.vl?`${d.vl} VL`:'',d.inter?`${d.inter} Int.`:'',d.lls?`${d.lls} LLS`:'',d.acces?`${d.acces} Acc.`:''].filter(Boolean).join('; ');
    return `${d.ops} op. / ${d.log} log.`+(det?`<br><small style="color:var(--soft)">(dont ${det})</small>`:'');
  };
  el.innerHTML=`<table class="tbl"><thead><tr><th>Année</th><th>Lancement travaux</th><th>Livraison</th></tr></thead><tbody>`
    +years.map(y=>`<tr><td>${y}</td><td>${cell(lan[y])}</td><td>${cell(liv[y])}</td></tr>`).join('')
    +`</tbody></table>`;
}
</script>
</body>
</html>
